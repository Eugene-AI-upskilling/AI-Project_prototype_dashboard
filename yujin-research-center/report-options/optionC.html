<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>리포트 시안 C · 2단 (필터 + 컴팩트 리스트)</title>
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;
  src:url("../assets/fonts/PretendardVariable.woff2") format("woff2-variations");}
:root{
  --blue-main:#1b74e4; --blue-point:#4dabf7; --blue-sub-1:#1c6fe6; --blue-navy:#0b2e6b;
  --blue-cta:#3182f6; --blue-outline:#3182f6;
  --ink-900:#040505; --ink-800:#17181b; --ink-500:#6b7684;
  --gray-100:#eeeff0; --gray-200:#cfd0d3; --gray-400:#8d9299; --gray-500:#616670;
  --white:#fff; --border-neutral:#dde4eb; --surface-tint:#ebf0f5;
  --price-up:#e0344b; --price-down:#143f96;
  --color-canvas:var(--white); --color-surface:var(--white); --color-surface-tint:var(--surface-tint);
  --color-foreground:var(--ink-900); --color-body:var(--ink-800); --color-muted:var(--ink-500);
  --color-hairline:var(--border-neutral);
  --color-brand:var(--blue-main); --color-primary:var(--blue-cta); --color-primary-hover:var(--blue-sub-1);
  --color-on-primary:var(--white); --color-point:var(--blue-point); --color-accent-outline:var(--blue-outline);
  --text-display:48px; --text-hero:34px; --text-title:27px; --text-lg:19px; --text-link:16px;
  --text-control:15px; --text-body:15px; --text-micro:12px;
  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:18px; --space-xl:32px;
  --radius-sm:6px; --radius-chip:10px; --radius-md:14px; --radius-lg:20px; --radius-full:9999px;
  --shadow-soft:rgba(17,24,39,.04) 0 2px 8px 0,rgba(17,24,39,.04) 0 1px 2px 0;
  --shadow-pop:rgba(17,24,39,.10) 0 16px 40px -12px,rgba(17,24,39,.05) 0 4px 12px 0;
  --ease-out:cubic-bezier(.16,1,.3,1); --dur-micro:120ms; --dur-toggle:200ms;
  --font-sans:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);font-size:var(--text-body);line-height:1.6;letter-spacing:-.01em;
  color:var(--color-foreground);background:var(--color-canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6,p{margin:0} button{font-family:inherit}
.cn-figure{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:1120px;margin:0 auto;padding:0 40px}
.section{padding:72px 0}
.sec-head{margin-bottom:28px}
.sec-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-micro);font-weight:700;color:var(--color-primary);letter-spacing:.02em;margin-bottom:10px}
.sec-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--color-point)}
.sec-title{font-size:var(--text-hero);font-weight:800;letter-spacing:-.025em;color:var(--blue-navy);line-height:1.22}
.sec-sub{margin-top:12px;font-size:var(--text-link);color:var(--color-muted);line-height:1.6;max-width:640px}
.row-between{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);height:50px;padding:0 22px;font-size:var(--text-control);font-weight:600;border:1px solid transparent;border-radius:var(--radius-md);cursor:pointer;white-space:nowrap}
.btn--text{background:transparent;color:var(--color-primary);font-weight:400;font-size:var(--text-link);height:auto;padding:0}
.btn--text:hover{opacity:.78}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 11px;font-size:var(--text-micro);font-weight:700;line-height:1;border-radius:var(--radius-full);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge--brand{background:rgba(49,130,246,.1);color:var(--color-primary)}
.badge--muted{background:transparent;color:var(--color-muted);border:1px solid var(--color-hairline)}
.badge--up{background:rgba(224,52,75,.1);color:var(--price-up)}
.badge--down{background:rgba(20,63,150,.1);color:var(--price-down)}
.up{color:var(--price-up)} .down{color:var(--price-down)}
.rate{font-weight:700}
.rate--buy{color:var(--price-up)} .rate--hold{color:var(--color-muted)} .rate--reduce{color:var(--price-down)}

/* ===== option C 전용 ===== */
.repC-2col{display:grid;grid-template-columns:208px 1fr;gap:32px;align-items:start}
.repC-side{position:sticky;top:28px;display:flex;flex-direction:column;gap:4px}
.repC-side .lbl{font-size:var(--text-micro);font-weight:700;color:var(--color-muted);letter-spacing:.04em;margin:0 0 8px 14px}
.repC-navbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 14px;border:none;background:transparent;border-radius:var(--radius-md);font-size:var(--text-body);font-weight:600;color:var(--color-body);cursor:pointer;text-align:left;transition:background var(--dur-micro) var(--ease-out)}
.repC-navbtn:hover{background:var(--surface-tint)}
.repC-navbtn.on{background:var(--ink-900);color:#fff}
.repC-navbtn .n{font-size:var(--text-micro);font-weight:700;opacity:.65;font-variant-numeric:tabular-nums}
.repC-card{border:1px solid #eef1f5;border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);overflow:hidden}
.repC-table{width:100%;border-collapse:collapse}
.repC-table th{text-align:left;font-size:var(--text-micro);color:var(--color-muted);font-weight:700;padding:16px 16px 12px;background:#fbfcfd;border-bottom:1px solid var(--color-hairline)}
.repC-table th.num{text-align:right}
.repC-table td{padding:15px 16px;border-bottom:1px solid var(--color-hairline);font-size:var(--text-body);vertical-align:middle}
.repC-table tr:last-child td{border-bottom:none}
.repC-table tbody tr{cursor:pointer;transition:background var(--dur-micro) var(--ease-out)}
.repC-table tbody tr:hover{background:var(--surface-tint)}
.repC-table .date{font-size:var(--text-micro);font-weight:700;color:var(--color-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.repC-ttl{font-weight:700;color:var(--ink-900);line-height:1.35}
.repC-ttl small{display:block;font-weight:500;font-size:var(--text-micro);color:var(--color-muted);margin-top:3px}
.repC-co{font-weight:700;color:var(--ink-800);white-space:nowrap}
.repC-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:820px){.repC-2col{grid-template-columns:1fr}.repC-side{position:static;flex-direction:row;flex-wrap:wrap}
  .repC-side .lbl{display:none}.repC-navbtn{width:auto}
  .repC-hideSm{display:none}}
</style>
</head>
<body>
<section class="section" id="reports">
  <div class="wrap">
    <div class="row-between sec-head">
      <div>
        <div class="sec-eyebrow"><span class="dot"></span>RESEARCH REPORTS</div>
        <h2 class="sec-title">숫자 뒤의 맥락까지, 유진 리서치</h2>
        <p class="sec-sub">현장을 읽고 끝까지 파고든 애널리스트의 시각. 발간 즉시 알림으로 받아보고, 관심 섹터만 골라보세요.</p>
      </div>
      <button class="btn btn--text">전체 리포트 보기 →</button>
    </div>
    <div class="repC-2col">
      <aside class="repC-side" id="repNav"></aside>
      <div class="repC-card">
        <table class="repC-table">
          <thead>
            <tr>
              <th>발간일</th><th>분류</th><th>리포트</th>
              <th class="repC-hideSm">종목</th><th class="repC-hideSm">투자의견</th><th class="num">상승여력</th>
            </tr>
          </thead>
          <tbody id="repBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<script>
const reports=[
  {kind:'sector',cat:'반도체',risk:'적극투자',tone:'up',title:'HBM 슈퍼사이클, 아직 2회말입니다',sum:'엔비디아 차세대 GPU 채택 가속 + HBM4 양산 전환. 국내 메모리 3社 수혜 폭 점검.',co:'SK하이닉스',rate:'적극매수',tp:'+22%',a:'김도현',d:'06.13'},
  {kind:'sector',cat:'2차전지',risk:'중립',tone:'up',title:'전기차 캐즘 끝? 하반기 수요 회복 신호',sum:'유럽 보조금 재개와 미국 IRA 수혜로 셀·소재 재고 정상화. 단기 반등은 가능하나 추세 전환은 확인 필요.',co:'에코프로비엠',rate:'중립',tp:'+5%',a:'이서연',d:'06.12'},
  {kind:'macro',cat:'투자전략',risk:'안정',tone:'up',title:'금리 인하기, 고배당주로 갈아탈 시간',sum:'밸류업 공시 기업 중 배당성향 상향 + 자사주 소각 병행 종목 선별. 변동성 방어.',co:'KB금융',rate:'매수',tp:'+11%',a:'박준영',d:'06.11'},
  {kind:'sector',cat:'AI인프라',risk:'적극투자',tone:'up',title:'데이터센터 전력난, 다음 수혜는 전력기기',sum:'AI 학습 전력 수요 폭증 → 변압기·전선 슈퍼사이클. 미국 수출 비중 높은 기업 주목.',co:'HD현대일렉트릭',rate:'적극매수',tp:'+27%',a:'정민수',d:'06.10'},
  {kind:'sector',cat:'바이오',risk:'적극투자',tone:'up',title:'비만치료제 밸류체인, CDMO가 핵심',sum:'GLP-1 수요 폭발로 위탁생산 캐파 부족. 국내 바이오 CDMO 수주 모멘텀 점검.',co:'삼성바이오로직스',rate:'매수',tp:'+16%',a:'한지우',d:'06.09'},
  {kind:'company',cat:'리츠',risk:'안정',tone:'down',title:'리츠, 단기 과열 — 차익 실현 구간',sum:'금리 인하 기대가 선반영되며 밸류에이션 부담 확대. 우량 물류 리츠로 압축, 단기 비중 축소 권고.',co:'ESR켄달스퀘어리츠',rate:'비중축소',tp:'-6%',a:'박준영',d:'06.06'},
];
const REP_GROUPS=[['전체',''],['매크로','macro'],['산업분석','sector'],['기업분석','company']];
let repFilter='';
const rateCls=v=>({'적극매수':'rate--buy','매수':'rate--buy','비중확대':'rate--buy','중립':'rate--hold','비중축소':'rate--reduce','매도':'rate--reduce'})[v]||'rate--hold';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function renderNav(){
  $('#repNav').innerHTML='<div class="lbl">리포트 분류</div>'+REP_GROUPS.map(([l,k])=>{
    const n=k?reports.filter(r=>r.kind===k).length:reports.length;
    return `<button class="repC-navbtn ${k===repFilter?'on':''}" data-k="${k}">${l}<span class="n">${n}</span></button>`;
  }).join('');
  $$('#repNav .repC-navbtn').forEach(b=>b.onclick=()=>{repFilter=b.dataset.k;render();});
}
function render(){
  renderNav();
  const list=reports.filter(r=>!repFilter||r.kind===repFilter);
  $('#repBody').innerHTML=list.length?list.map(r=>`
    <tr>
      <td class="date">${r.d}</td>
      <td><span class="badge badge--brand">${r.cat}</span></td>
      <td><div class="repC-ttl">${r.title}<small>${r.a} 애널리스트${r.risk?' · '+r.risk:''}</small></div></td>
      <td class="repC-hideSm repC-co">${r.co||''}</td>
      <td class="repC-hideSm"><span class="rate ${rateCls(r.rate)}">${r.rate||''}</span></td>
      <td class="num ${r.tone}">${r.tp?(/[%원]/.test(r.tp)?r.tp:r.tp):''}</td>
    </tr>`).join(''):'<tr><td colspan="6" style="padding:24px;color:var(--color-muted)">표시할 리포트가 없습니다.</td></tr>';
}
render();
</script>
</body>
</html>
