<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Eugene Insight Lab · Claude Showreel Upgrade</title>
<style>
@font-face{font-family:Pretendard;src:url(PretendardVariable.woff2) format('woff2-variations');font-weight:45 920;font-display:block}
html,body{margin:0;background:#000;height:100%}
canvas{display:block;width:100vw;max-height:100vh;object-fit:contain;margin:auto}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ───────── Eugene Insight Lab · 15s showreel ─────────
   Deterministic timeline: render(t) draws the frame at time t (seconds).
   window.renderFrame(i, fps, samples) = motion-blurred frame for the encoder. */
const W = 1920, H = 1080, DUR = 15, CX = W / 2, CY = H / 2;
const cv = document.getElementById('c');
const out = cv.getContext('2d');
const work = document.createElement('canvas'); work.width = W; work.height = H;
const ctx = work.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d');

const C = {
  ink: '#090608', ink2: '#160b10', red: '#d21f23', redHi: '#ff3b45', redDeep: '#7a0b10',
  up: '#ff4458', down: '#3d7bff', blue: '#d21f23', bluePt: '#f28c91', navy: '#57151d',
  white: '#ffffff', paper: '#f8f5f3', tint: '#f6e9e9', gray: '#8d9299', muted: '#6b7684', body: '#17181b'
};
const F = (w, s) => `${w} ${s}px Pretendard`;

/* ───────── math ───────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
};
// damped spring step response, e = seconds since start
function spring(e, zeta = .5, w = 14) {
  if (e <= 0) return 0;
  const wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * e) * (Math.cos(wd * e) + zeta * w / wd * Math.sin(wd * e));
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ───────── shared assets ───────── */
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), id = g.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); }
let FRAME = 0;

function bg(col) { ctx.fillStyle = col; ctx.fillRect(-W, -H, W * 3, H * 3); }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function textSpaced(c, str, x, y, spacing, align = 'left') {
  // manual letter-spacing (canvas letterSpacing fallback-safe)
  const widths = [...str].map(ch => c.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (widths.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const prev = c.textAlign; c.textAlign = 'left';
  [...str].forEach((ch, i) => { c.fillText(ch, cx, y); cx += widths[i] + spacing; });
  c.textAlign = prev; return total;
}

/* Eugene globe — stylised from the logo mark: red sphere, silver swirl */
function sphere(c, x, y, r, sx = 1, sy = 1, rot = 0) {
  if (r <= .5) return;
  c.save(); c.translate(x, y); c.scale(sx, sy);
  const g = c.createRadialGradient(-r * .35, -r * .4, r * .05, 0, 0, r);
  g.addColorStop(0, '#ff6b70'); g.addColorStop(.45, C.red); g.addColorStop(1, '#8e0d12');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
  c.save(); c.clip(); c.rotate(rot);
  const s = c.createLinearGradient(-r, -r, r, r);
  s.addColorStop(0, '#f2f3f5'); s.addColorStop(1, '#b9bdc4');
  c.fillStyle = s;
  c.beginPath();                       // upper swirl
  c.moveTo(r * .05, -r * 1.05);
  c.bezierCurveTo(r * .9, -r * .95, r * 1.15, -r * .1, r * .62, r * .18);
  c.bezierCurveTo(r * .35, r * .32, r * .25, -r * .1, r * .42, -r * .35);
  c.bezierCurveTo(r * .5, -r * .55, r * .2, -r * .62, r * .05, -r * 1.05); c.fill();
  c.beginPath();                       // left swirl
  c.moveTo(-r * 1.05, r * .1);
  c.bezierCurveTo(-r * .9, -r * .75, -r * .3, -r * .8, -r * .22, -r * .38);
  c.bezierCurveTo(-r * .15, -r * .05, -r * .55, -r * .05, -r * .52, r * .22);
  c.bezierCurveTo(-r * .5, r * .45, -r * .85, r * .55, -r * 1.05, r * .1); c.fill();
  c.restore();
  c.fillStyle = 'rgba(255,255,255,.35)';   // specular
  c.beginPath(); c.ellipse(-r * .38, -r * .45, r * .22, r * .12, -.6, 0, Math.PI * 2); c.fill();
  c.restore();
}

/* ───────── HUD (reel chrome) ───────── */
function hud(t, light, a = 1) {
  if (a <= 0) return;
  const col = light ? `rgba(5,6,10,${.55 * a})` : `rgba(255,255,255,${.55 * a})`;
  ctx.save(); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.font = F(600, 18); ctx.textBaseline = 'top';
  textSpaced(ctx, 'EUGENE INSIGHT LAB — SHOWREEL 2026', 64, 52, 3);
  const f = Math.floor(t * 60), tc = `00:${String(Math.floor(t)).padStart(2, '0')}:${String(f % 60).padStart(2, '0')}`;
  ctx.font = F(600, 18); textSpaced(ctx, tc, W - 64, 52, 3, 'right');
  const m = 26;                      // crop marks
  [[48, 96], [W - 48, 96], [48, H - 48], [W - 48, H - 48]].forEach(([x, y], i) => {
    const sx = i % 2 ? -1 : 1, sy = i < 2 ? 1 : -1;
    ctx.beginPath(); ctx.moveTo(x, y + sy * m); ctx.lineTo(x, y); ctx.lineTo(x + sx * m, y); ctx.stroke();
  });
  if (t >= 4 && t < 11) {
    ctx.font = F(500, 16); ctx.textAlign = 'right';
    ctx.fillText('ILLUSTRATIVE DATA · 연출용 데이터', W - 64, H - 72);
  }
  ctx.fillRect(64, H - 66, (W - 128) * (t / DUR), 2);   // progress
  ctx.restore();
}


/* RedSun-inspired tracked lighting. Deterministic camera movement for export. */
function halo(x, y, radius, strength = .23, light = false) {
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  g.addColorStop(0, `rgba(235,55,65,${strength})`);
  g.addColorStop(.38, `rgba(210,31,35,${strength * .45})`);
  g.addColorStop(1, 'rgba(210,31,35,0)');
  ctx.globalCompositeOperation = light ? 'source-over' : 'screen';
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function orbitField(t, amount = 1) {
  ctx.save(); ctx.translate(CX, CY + 30);
  ctx.rotate(-.25 + t * .025); ctx.scale(1, .58);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.arc(0, 0, 250 + i * 140, -.35 + t * .12 + i, 3.2 + t * .12 + i);
    ctx.lineWidth = i === 0 ? 2 : 1;
    ctx.strokeStyle = `rgba(240,135,143,${(.14 - i * .025) * amount})`; ctx.stroke();
  }
  ctx.restore();
}
function surfaceField(t) {
  halo(1260 + Math.sin(t * .8) * 240, 475, 820, .085, true);
  ctx.save(); ctx.strokeStyle = 'rgba(110,35,43,.045)'; ctx.lineWidth = 1;
  for (let i = -10; i < 12; i++) {
    ctx.beginPath(); ctx.moveTo(CX + i * 24, 120); ctx.lineTo(CX + i * 230, H); ctx.stroke();
  }
  for (let i = 0; i < 7; i++) {
    const y = 160 + Math.pow(i / 6, 2) * 910;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}

/* ───────── S1 · drop & impact (0 – 1.5) ───────── */
function s1(t) {
  bg(C.ink);
  halo(CX + Math.sin(t * 1.8) * 190, CY, 700, .19);
  orbitField(t, prog(t, .25, .8));
  const R = 72;
  let y = CY, sx = 1, sy = 1;
  if (t < .6) {
    const p = t / .6; y = lerp(-180, CY, p * p); sy = 1 + .38 * p * p; sx = 1 - .18 * p * p;
    const tail = 420 * p;                         // speed streak
    const g = ctx.createLinearGradient(0, y - tail, 0, y);
    g.addColorStop(0, 'rgba(210,31,35,0)'); g.addColorStop(1, 'rgba(255,80,85,.55)');
    ctx.fillStyle = g; ctx.fillRect(CX - R * .55, y - tail, R * 1.1, tail);
  } else {
    const k = 1 - spring(t - .6, .28, 26); sx = 1 + .5 * k; sy = 1 - .5 * k;
  }
  for (let i = 0; i < 4; i++) {                    // shockwaves
    const e = (t - .6 - i * .065) / .9;
    if (e <= 0 || e >= 1) continue;
    ctx.beginPath(); ctx.arc(CX, CY, R + E.outExpo(e) * (1250 - i * 180), 0, Math.PI * 2);
    ctx.lineWidth = lerp(16 - i * 3, .5, e);
    ctx.strokeStyle = i % 2 ? `rgba(255,255,255,${(1 - e) * .5})` : `rgba(255,59,69,${(1 - e) * .9})`;
    ctx.stroke();
  }
  // dust particles from impact
  const r = rng(11);
  for (let i = 0; i < 70; i++) {
    const a = r() * Math.PI * 2, sp = 300 + r() * 900, e = t - .6;
    if (e <= 0) break;
    const d = sp * (1 - Math.exp(-e * 3.2)) / 3.2 * 2.2;
    ctx.fillStyle = `rgba(255,${120 + r() * 120 | 0},${110 + r() * 60 | 0},${clamp(1 - e / .85)})`;
    ctx.beginPath(); ctx.arc(CX + Math.cos(a) * (R + d), CY + Math.sin(a) * (R + d) * .8, 1.5 + r() * 3.5, 0, 7); ctx.fill();
  }
  const grow = 1 + E.inExpo(prog(t, 1.18, 1.5)) * 26;
  sphere(ctx, CX, y, R * grow, sx, sy, t * 2.2);
  if (t > .82) {
    const a = prog(t, .82, 1.05) * (1 - prog(t, 1.15, 1.25));
    ctx.fillStyle = `rgba(255,255,255,${a * .8})`; ctx.font = F(600, 22); ctx.textBaseline = 'middle';
    textSpaced(ctx, 'EUGENE INVESTMENT & SECURITIES · RESEARCH CENTER', CX, CY + 165, lerp(26, 8, E.outExpo(prog(t, .82, 1.2))), 'center');
  }
  if (t >= .6) { ctx.fillStyle = `rgba(255,255,255,${(1 - prog(t, .6, .7)) * .55})`; ctx.fillRect(0, 0, W, H); }
}

/* ───────── S2 · kinetic type (1.5 – 4.0) ───────── */
const WORDS = [
  { t: 1.5, txt: '데이터를', bg: C.red, fg: '#fff', sub: 'DATA' },
  { t: 2.0, txt: '읽고', bg: C.ink, fg: C.redHi, sub: 'READ' },
  { t: 2.5, txt: '해석하고', bg: C.paper, fg: C.ink, sub: 'INTERPRET' },
  { t: 3.0, txt: '움직인다.', bg: C.redDeep, fg: '#fff', sub: 'MOVE' }
];
function s2(t) {
  if (t < 3.5) {
    const i = Math.min(3, Math.floor((t - 1.5) / .5)), w = WORDS[i], e = t - w.t;
    bg(w.bg);
    const light = w.bg === C.paper;
    halo(CX + Math.sin(t * 2) * 480, CY - 100, 850, light ? .05 : .13, light);
    // giant ghost index
    ctx.save(); ctx.font = F(900, 760); ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = light ? 'rgba(5,6,10,.045)' : 'rgba(255,255,255,.07)';
    ctx.fillText(`0${i + 1}`, W + 40 - E.outExpo(clamp(e / .5)) * 60, H + 120); ctx.restore();
    // word, per-character masked rise
    ctx.save(); ctx.font = F(900, 290); ctx.textBaseline = 'alphabetic';
    const chars = [...w.txt], ws = chars.map(ch => ctx.measureText(ch).width);
    const total = ws.reduce((a, b) => a + b, 0) - 8 * (chars.length - 1);
    let x = CX - total / 2; const base = CY + 100;
    ctx.beginPath(); ctx.rect(0, base - 300, W, 380); ctx.clip();
    chars.forEach((ch, k) => {
      const p = E.outExpo(clamp((e - k * .032) / .3));
      ctx.save(); ctx.translate(x + ws[k] / 2, base + (1 - p) * 330);
      ctx.rotate((1 - p) * .18); ctx.scale(1 + (1 - p) * .2, 1);
      ctx.fillStyle = w.fg; ctx.textAlign = 'center'; ctx.fillText(ch, 0, 0); ctx.restore();
      x += ws[k] - 8;
    });
    ctx.restore();
    // sub label + index
    ctx.fillStyle = light ? C.muted : 'rgba(255,255,255,.75)'; ctx.font = F(700, 24); ctx.textBaseline = 'middle';
    const sa = prog(e, .08, .25); ctx.globalAlpha = sa;
    textSpaced(ctx, `${w.sub}  —  0${i + 1} / 04`, CX, base + 95, 10, 'center'); ctx.globalAlpha = 1;
    // wipe from the previous colour
    if (i > 0) {
      const p = E.inOutExpo(prog(e, 0, .16));
      ctx.fillStyle = WORDS[i - 1].bg;
      ctx.beginPath(); ctx.moveTo(p * (W + 400), 0); ctx.lineTo(W + 400, 0); ctx.lineTo(W + 400, H); ctx.lineTo(p * (W + 400) - 400, H); ctx.fill();
    }
    hud(t, light);
  } else {
    // INSIGHT fly-through
    bg(C.ink);
    const e = t - 3.5, z = Math.pow(70, E.inExpo(prog(t, 3.66, 4.0)));
    // zoom lines
    const r = rng(23), zl = prog(t, 3.6, 4.0);
    ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${.35 * zl})`; ctx.lineWidth = 2;
    for (let k = 0; k < 90; k++) {
      const a = r() * Math.PI * 2, d0 = 200 + r() * 900, len = 40 + zl * zl * (300 + r() * 700);
      const d = d0 + E.inExpo(zl) * 900;
      ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * d, CY + Math.sin(a) * d); ctx.lineTo(CX + Math.cos(a) * (d + len), CY + Math.sin(a) * (d + len)); ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.translate(CX + 70, CY); ctx.scale(z, z); ctx.translate(-70, 0);
    ctx.font = F(900, 250); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const chars = 'INSIGHT'.split(''); const ws = chars.map(ch => ctx.measureText(ch).width);
    const total = ws.reduce((a, b) => a + b, 0) + 10 * (chars.length - 1);
    let x = -total / 2;
    ctx.save(); ctx.beginPath(); ctx.rect(-W, -150, W * 2, 300); ctx.clip();
    chars.forEach((ch, k) => {
      const p = E.outExpo(clamp((e - k * .025) / .22));
      ctx.lineWidth = 3 / Math.sqrt(z); ctx.strokeStyle = '#fff';
      ctx.fillStyle = `rgba(210,31,35,${.95 * (1 - prog(t, 3.7, 3.9))})`;
      ctx.fillText(ch, x + ws[k] / 2, (1 - p) * -260);
      ctx.strokeText(ch, x + ws[k] / 2, (1 - p) * -260);
      x += ws[k] + 10;
    });
    ctx.restore(); ctx.restore();
    hud(t, false, 1 - prog(t, 3.7, 3.9));
  }
}

/* ───────── S3 · market chart (4.0 – 6.5) ───────── */
const CANDLES = (() => {
  const r = rng(42), out = []; let p = 100;
  for (let i = 0; i < 58; i++) {
    const drift = i < 14 ? -.25 : i < 22 ? .1 : .85;
    const o = p, c = p + (r() - .42) * 4.2 + drift, h = Math.max(o, c) + r() * 2.2, l = Math.min(o, c) - r() * 2.2;
    out.push({ o, c, h, l }); p = c;
  }
  const lo = Math.min(...out.map(d => d.l)), hi = Math.max(...out.map(d => d.h));
  let ma = out[0].c;
  out.forEach(d => { ma = ma * .78 + d.c * .22; d.ma = ma; });
  return { list: out, lo, hi };
})();
const CH = { x0: 170, x1: 1750, y0: 300, y1: 930 };
const cx_ = i => lerp(CH.x0, CH.x1, (i + .5) / CANDLES.list.length);
const cy_ = v => lerp(CH.y1, CH.y0, (v - CANDLES.lo) / (CANDLES.hi - CANDLES.lo));
function maPoint(f) {               // point along the MA polyline, f in [0,1]
  const L = CANDLES.list, n = L.length - 1, x = f * n, i = Math.min(n - 1, Math.floor(x)), u = x - i;
  return [lerp(cx_(i), cx_(i + 1), u), lerp(cy_(L[i].ma), cy_(L[i + 1].ma), u)];
}
function s3(t) {
  bg(C.ink);
  halo(1450, 220, 820, .12);
  const f = E.inOutCubic(prog(t, 4.45, 5.85));
  const head = maPoint(f);
  const zin = E.inExpo(prog(t, 6.0, 6.5));
  const s = (1 + .07 * E.inOutCubic(prog(t, 4.0, 6.0))) * Math.pow(45, zin);
  const piv = [lerp(CX, head[0], prog(t, 5.5, 6.2)), lerp(CY, head[1], prog(t, 5.5, 6.2))];
  ctx.save(); ctx.translate(piv[0], piv[1]); ctx.scale(s, s); ctx.translate(-piv[0], -piv[1]);
  // Soft red tracking light stays behind the plotted information.
  halo(head[0], head[1], 370, .15 * f);
  // grid
  ctx.lineWidth = 1;
  for (let i = 0; i <= 6; i++) {
    const p = E.outExpo(prog(t, 4.0 + i * .03, 4.55 + i * .03)), y = lerp(CH.y0, CH.y1, i / 6);
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.moveTo(CH.x0, y); ctx.lineTo(lerp(CH.x0, CH.x1, p), y); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${.35 * p})`; ctx.font = F(500, 16); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText((lerp(2860, 2380, i / 6)).toFixed(0), CH.x1 + 18, y);
  }
  for (let i = 0; i <= 12; i++) {
    const p = E.outExpo(prog(t, 4.05 + i * .02, 4.6 + i * .02)), x = lerp(CH.x0, CH.x1, i / 12);
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.beginPath(); ctx.moveTo(x, CH.y1); ctx.lineTo(x, lerp(CH.y1, CH.y0, p)); ctx.stroke();
  }
  // area under MA
  const n = CANDLES.list.length - 1;
  if (f > 0) {
    ctx.beginPath(); ctx.moveTo(cx_(0), CH.y1);
    for (let i = 0; i <= n * f; i++) ctx.lineTo(cx_(i), cy_(CANDLES.list[i].ma));
    ctx.lineTo(head[0], head[1]); ctx.lineTo(head[0], CH.y1); ctx.closePath();
    const g = ctx.createLinearGradient(0, CH.y0, 0, CH.y1); g.addColorStop(0, 'rgba(210,31,35,.26)'); g.addColorStop(1, 'rgba(210,31,35,0)');
    ctx.fillStyle = g; ctx.fill();
  }
  // candles
  CANDLES.list.forEach((d, i) => {
    const p = clamp((t - (4.12 + i * .021)) / .3); if (p <= 0) return;
    const b = E.outBack(p), up = d.c >= d.o, x = cx_(i), w = 15;
    const mid = (cy_(d.o) + cy_(d.c)) / 2, hh = Math.max(3, Math.abs(cy_(d.o) - cy_(d.c))) * b;
    ctx.fillStyle = ctx.strokeStyle = up ? C.up : C.down; ctx.globalAlpha = clamp(p * 3);
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, lerp(mid, cy_(d.h), E.outCubic(p))); ctx.lineTo(x, lerp(mid, cy_(d.l), E.outCubic(p))); ctx.stroke();
    ctx.fillRect(x - w / 2, mid - hh / 2, w, hh); ctx.globalAlpha = 1;
  });
  // MA line
  if (f > 0) {
    ctx.save(); ctx.lineWidth = 5; ctx.lineJoin = ctx.lineCap = 'round';
    ctx.shadowColor = C.bluePt; ctx.shadowBlur = 24; ctx.strokeStyle = '#ffe5e6';
    ctx.beginPath(); ctx.moveTo(cx_(0), cy_(CANDLES.list[0].ma));
    for (let i = 1; i <= n * f; i++) ctx.lineTo(cx_(i), cy_(CANDLES.list[i].ma));
    ctx.lineTo(head[0], head[1]); ctx.stroke(); ctx.restore();
    const pulse = (t * 2.2) % 1;
    ctx.strokeStyle = `rgba(255,255,255,${1 - pulse})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(head[0], head[1], 10 + pulse * 34, 0, 7); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(head[0], head[1], 9, 0, 7); ctx.fill();
  }
  // callout at the high
  const cp = spring(t - 5.45, .5, 16);
  if (t > 5.45) {
    const [hx, hy] = [cx_(54), cy_(CANDLES.list[54].h)];
    ctx.save(); ctx.translate(hx - 40, hy - 70); ctx.scale(cp, cp);
    ctx.fillStyle = C.red; rrect(ctx, -170, -34, 200, 60, 30); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = F(800, 24); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const [sx, sy] = shake(t); ctx.translate(sx, sy);
  if (t < 1.5) s1(t); else if (t < 4.0) s2(t); else if (t < 6.5) s3(t);
  else if (t < 9.0) s4(t); else if (t < 11.0) s5(t); else s6(t);
  ctx.restore();
}
function composite(t, samples = 1, fps = 60) {
  out.globalAlpha = 1;
  for (let s = 0; s < samples; s++) {
    render(t + (samples > 1 ? (s / samples) * (0.5 / fps) : 0));
    out.globalAlpha = 1 / (s + 1); out.drawImage(work, 0, 0);
  }
  out.globalAlpha = 1;
  // film grain + vignette (stable per frame)
  out.save(); out.globalCompositeOperation = 'overlay'; out.globalAlpha = .032;
  const ox = (FRAME * 73) % 256, oy = (FRAME * 151) % 256;
  out.translate(-ox, -oy); out.fillStyle = out.createPattern(grain, 'repeat'); out.fillRect(0, 0, W + 256, H + 256); out.restore();
  const v = out.createRadialGradient(CX, CY, H * .45, CX, CY, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.18)');
  out.fillStyle = v; out.fillRect(0, 0, W, H);
}
window.renderFrame = (i, fps = 60, samples = 4) => { FRAME = i; composite(i / fps, samples, fps); };
window.ready = document.fonts.load(F(800, 40)).then(() => document.fonts.load(F(600, 20))).then(() => true);
// live playback when opened directly
if (!/[?&]render/.test(location.search)) window.ready.then(() => {
  const t0 = performance.now();
  const loop = now => { const t = ((now - t0) / 1000) % DUR; FRAME = Math.floor(t * 60); composite(t, 1); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
