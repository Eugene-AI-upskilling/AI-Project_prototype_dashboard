se,dockTween=null;\n let w=shelf.clientWidth,h=shelf.clientHeight;\n const resize=new ResizeObserver(()=>{w=shelf.clientWidth;h=shelf.clientHeight;draw();});resize.observe(shelf);\n const buttonState=()=>{toggle.textContent=docked?'\u21bb \uacf5\uc804 \uc7ac\uc0dd':'\u2161 \uacf5\uc804 \uba48\ucd94\uae30';toggle.setAttribute('aria-pressed',String(docked));};\n function draw(){\n  const mobile=w\u003c650,cx=w*(mobile?.5:.67),cy=h*(mobile?.66:.5),rx=w*(mobile?.265:.245),ry=mobile?65:91;\n  books.forEach((book,i)=>{const a=phase+i*Math.PI/2,depth=(Math.sin(a)+1)/2,scale=(mobile?.69:.70)+depth*.29;const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;book.style.transform=`translate(${x-book.offsetWidth/2}px,${y-book.offsetHeight/2}px) scale(${scale})`;book.style.zIndex=String(Math.round(depth*10)+4);book.style.opacity=String(.68+depth*.32);book.style.setProperty('--book-y',(-14+Math.cos(a)*17)+'deg');book.style.setProperty('--book-z',Math.cos(a)*-4+'deg');book.tabIndex=book.dataset.book===selectedBook?0:-1;});\n }\n function tick(t){\n  const dt=Math.min((t-previous)/1000,.05)||0;previous=t;\n  if(!document.hidden&&visible){\n   if(dockTween&&!globalPaused){const p=Math.min((t-dockTween.time)/850,1),ease=1-Math.pow(1-p,4);phase=dockTween.from+dockTween.delta*ease;if(p===1)dockTween=null;draw();}\n   else if(!globalPaused&&!reduced.matches&&!docked&&!hovered&&!focused){phase+=dt*.22;draw();}\n  }\n  frame=requestAnimationFrame(tick);\n }\n const previousSelect=selectBook;\n selectBook=function(id,open=false){\n  previousSelect(id,open);const index=books.findIndex(b=>b.dataset.book===id);if(index\u003c0)return;\n  docked=true;buttonState();let target=Math.PI/2-index*Math.PI/2,delta=((target-phase+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;\n  if(reduced.matches||globalPaused){phase+=delta;dockTween=null;draw();}else dockTween={from:phase,delta,time:performance.now()};\n };\n toggle.addEventListener('click',()=>{docked=!docked;dockTween=null;if(!docked&&bookOpen)previousSelect(selectedBook,false);buttonState();draw();});\n shelf.addEventListener('pointerenter',ev=>{if(ev.pointerType!=='touch')hovered=true;});shelf.addEventListener('pointerleave',()=>{hovered=false;});\n shelf.addEventListener('focusin',()=>{focused=true;});shelf.addEventListener('focusout',ev=>{focused=shelf.contains(ev.relatedTarget);});\n window.addEventListener('message',ev=>{if(ev.source!==parent||ev.data?.type!=='demo-replay')return;phase=Math.PI/2;docked=false;dockTween=null;previousSelect('corp',false);buttonState();draw();});\n reduced.addEventListener('change',()=>{dockTween=null;draw();});\n buttonState();draw();frame=requestAnimationFrame(tick);\n window.addEventListener('pagehide',()=>{cancelAnimationFrame(frame);resize.disconnect();},{once:true});\n})();\n\n\u003c/script>\u003c/body>\u003c/html>"};
