<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Pretendard — hero, title, body, control & micro" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-canvas); color: var(--color-foreground); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--color-hairline); }
  .row:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-muted); width: 110px; flex: none; }
</style></head>
<body>
  <div class="row"><span class="meta">32 / 700</span><span style="font-size:var(--text-hero); font-weight:700; letter-spacing:-0.02em">안전하게 시작하는 투자</span></div>
  <div class="row"><span class="meta">24 / 700</span><span style="font-size:var(--text-title); font-weight:700">자산 현황</span></div>
  <div class="row"><span class="meta">15 / 700</span><span style="font-size:var(--text-control); font-weight:700">30초면 가입 완료</span></div>
  <div class="row"><span class="meta">14 / 400</span><span style="font-size:var(--text-body); font-weight:400">수수료와 위험을 명확히 안내합니다.</span></div>
  <div class="row"><span class="meta">12 / 400</span><span style="font-size:var(--text-micro); font-weight:400; color:var(--color-muted)">가입에 사용할 이메일을 입력하세요</span></div>
</body></html>
