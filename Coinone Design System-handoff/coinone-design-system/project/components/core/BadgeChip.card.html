<!-- @dsCard group="Components" viewport="700x150" name="Badge & Chip" subtitle="Status pills (KR up=red / down=blue) and filter chips" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--color-canvas); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Badge, Chip } = window.CoinoneDesignSystem_c36949;
  function Demo() {
    const [active, setActive] = React.useState("all");
    return (
      <div>
        <div className="row">
          <Badge tone="brand">신규</Badge>
          <Badge tone="point">AI</Badge>
          <Badge tone="up">+2.41%</Badge>
          <Badge tone="down">-1.08%</Badge>
          <Badge tone="neutral">대기</Badge>
          <Badge tone="muted">미체결</Badge>
        </div>
        <div className="row">
          {[["all","전체"],["own","보유"],["fav","관심"],["new","신규"]].map(([id,l]) => (
            <Chip key={id} active={active===id} onClick={() => setActive(id)}>{l}</Chip>
          ))}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
