<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 16px 24px; background: var(--color-canvas); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Table } = window.CoinoneDesignSystem_c36949;
  const Pct = (v) => <span style={{ color: v >= 0 ? "var(--price-up)" : "var(--price-down)", fontWeight: 600 }}>{v >= 0 ? "+" : ""}{v.toFixed(2)}%</span>;
  const rows = [
    { id: 1, name: "비트코인 BTC", price: "₩142,300,000", change: 2.41 },
    { id: 2, name: "이더리움 ETH", price: "₩4,820,500", change: -1.08 },
    { id: 3, name: "리플 XRP", price: "₩3,212", change: 5.62 },
    { id: 4, name: "솔라나 SOL", price: "₩268,400", change: -0.34 },
  ];
  function Demo() {
    return (
      <Table
        columns={[
          { key: "name", header: "이름" },
          { key: "price", header: "현재가", align: "right" },
          { key: "change", header: "변동률", align: "right", render: (v) => Pct(v) },
        ]}
        rows={rows}
        onRowClick={() => {}}
      />
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
