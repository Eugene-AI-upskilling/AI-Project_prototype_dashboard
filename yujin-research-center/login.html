<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 · 유진 Insight Lab</title>
<!-- 로그인은 진입 페이지(index.html)의 쇼릴 → 고객 유형 선택으로 통합됨. 예전 링크 · OAuth 복귀 주소(?oauth=1 · #access_token)는 그대로 넘긴다 -->
<link rel="canonical" href="index.html" />
<script>
(function(){
  var q=new URLSearchParams(location.search);
  if(!q.has('start')) q.set('start','1');
  location.replace('index.html?'+q.toString()+location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=index.html?start=1" /></noscript>
</head>
<body>
<p style="font-family:sans-serif;padding:24px">로그인 화면으로 이동합니다. <a href="index.html?start=1">바로 가기</a></p>
</body>
</html>
