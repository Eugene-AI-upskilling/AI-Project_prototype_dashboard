<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 리서치 라운지 · 유진 Insight Lab</title>
<meta name="description" content="유진 리포트 원문을 근거로 답하는 AI 리서치 담당자. 사실 · 당사 견해 · 반대 근거 · 확인할 점을 출처와 함께." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preload" href="assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="assets/app.css" />
<link rel="stylesheet" href="assets/lounge.css" />
</head>
<body data-page-eyebrow="AI RESEARCH LOUNGE" data-page-title="AI 리서치 라운지"
      data-page-desc="유진 리포트 원문을 근거로 답합니다. 검수된 질문은 바로, 새 질문은 애널리스트 검수 후 당일 답변합니다.">
<main id="main">
  <div id="demoSlot"></div>
  <div class="wrap">
    <div class="ax-layout">
      <!-- 사이드: 질문 작성 · 대표 질문 · 내 이력 -->
      <aside class="ax-side" aria-label="질문">
        <form class="lx-card ax-compose" id="compose" onsubmit="return false">
          <label class="lx-eyebrow" for="qIn">새 질문</label>
          <textarea class="lx-textarea" id="qIn" style="margin-top:8px" maxlength="300" placeholder="예: HBM 공급 과잉 우려, 내년까지 이어질까?"></textarea>
          <div class="row"><span class="hint" id="modeHint">새 질문은 AI 초안 → 애널리스트 검수 후 답변</span><button class="btn btn--primary btn--sm" type="submit" id="qGo">질문</button></div>
        </form>
        <div>
          <div class="ax-sec">자주 묻는 질문</div>
          <div class="ax-plist" id="presets"></div>
        </div>
        <div>
          <div class="ax-sec">내 질문</div>
          <div class="ax-plist" id="mine"></div>
        </div>
      </aside>

      <!-- 본문: 답변 -->
      <section id="view" aria-live="polite"></section>
    </div>
  </div>
</main>

<!-- 출처 모달 -->
<div class="lx-ov" id="srcOv" role="dialog" aria-modal="true" aria-labelledby="srcH">
  <div class="lx-modal" style="max-width:620px">
    <div class="lx-modal__h"><div><div class="lx-eyebrow" id="srcK">리포트 원문</div><h3 id="srcH"></h3></div><button class="auth-x" data-x aria-label="닫기">×</button></div>
    <div class="lx-ctx ax-srcbody" id="srcB"></div>
    <a class="btn btn--secondary btn--block" id="srcPdf" style="margin-top:12px" target="_blank" rel="noopener">원문 PDF 열기 ↗</a>
  </div>
</div>

<!-- 상담 모달 -->
<div class="lx-ov" id="csOv" role="dialog" aria-modal="true" aria-labelledby="csH">
  <div class="lx-modal">
    <div class="lx-modal__h"><div><div class="lx-eyebrow">담당자 연결</div><h3 id="csH">이 질문을 담당자에게 이어서</h3></div><button class="auth-x" data-x aria-label="닫기">×</button></div>
    <div class="lx-field"><span>함께 전달되는 맥락</span><div class="lx-ctx" id="csCtx"></div></div>
    <label class="lx-field"><span>추가로 묻고 싶은 점</span><textarea class="lx-textarea" id="csMemo" placeholder="예: 2Q 실적 기대치 가정이 궁금합니다."></textarea></label>
    <button class="btn btn--primary btn--block" id="csGo">요청 보내기</button>
  </div>
</div>

<script src="assets/lounge-proto.js"></script>
<script src="assets/lounge-api.js"></script>
<script src="assets/partials.js"></script>
<script>
(async function(){
  const E=IL.esc;
  const $=s=>document.querySelector(s);
  const params=new URLSearchParams(location.search);
  const live = !!(await ILAPI.ready());
  let cur=null, curN=null, list=[], pollT=null;

  /* ── 예시 데이터(서버 없을 때) → 공통 구조 ── */
  function mockNorm(id){
    const a=IL.ANSWERS[id]; if(!a) return null;
    const ci=([sid,p])=>{ const s=IL.SOURCES[sid]; return {title:s.title,date:s.date.replace(/\./g,'-'),page:p,status:'ok',quote:'',mock:sid}; };
    const st=(text,src)=>text&&text!=='—'?{text,cite:src&&src[0]?ci(src[0]):null}:null;
    return { id, q:a.q, topic:a.topic, status:a.status, stale:!!(a.stale&&a.stale.on), staleNote:a.stale?a.stale.note:'',
      reviewer:a.review?a.review.by:'', reviewedAt:a.review?a.review.at:'', baseDate:a.baseDate||'', verdict:a.verdict||'',
      routeReason:a.holdNote||'', meta:{cite_ok:6,cite_total:6},
      hyps:(a.hyps||[]).map(h=>({t:h.t,strength:h.strength,tone:h.tone,facts:h.fact.map((f,i)=>st(f,[h.factSrc[i]])).filter(Boolean),
        view:st(h.view,h.viewSrc),counter:st(h.counter,h.counterSrc),check:h.check})) };
  }

  /* ── 공통 렌더 ── */
  const chip=c=>{ if(!c) return '';
    const ic={ok:'✓',partial:'△',missing:'!'}[c.status]||'';
    return `<button type="button" class="lx-cite lx-cite--${c.status}" data-rid="${c.rid||''}" data-page="${c.page||''}" data-mock="${c.mock||''}" data-q="${E(c.quote)}"
      title="${E(c.title)} · ${E(c.date)} · ${c.page}쪽 · 원문 대조 ${c.status==='ok'?'일치':c.status==='partial'?'부분 일치':'확인 필요'}">${ic} ${E((c.title||'').slice(0,16))}${(c.title||'').length>16?'…':''} · ${E((c.date||'').slice(2))} · p.${c.page}</button>`; };
  const row=(label,cls,s)=>`<dt class="${cls}">${label}</dt><dd>${s?E(s.text)+`<span class="cites">${chip(s.cite)}</span>`:'<span class="lx-muted">원문에서 찾지 못함</span>'}</dd>`;
  const hypHTML=h=>`<article class="ax-hyp"><div class="ax-hyp__h"><b>${E(h.t)}</b><span class="ax-str ax-str--${h.tone}">근거 ${E(h.strength)}</span></div>
      <dl class="ax-rows">
        <dt>사실</dt><dd>${h.facts.length?h.facts.map(f=>`${E(f.text)}<span class="cites">${chip(f.cite)}</span>`).join(''):'<span class="lx-muted">—</span>'}</dd>
        ${row('당사 견해','view',h.view)}${row('반대 근거','counter',h.counter)}
        <dt>확인할 점</dt><dd><ul>${h.check.map(c=>`<li>${E(c)}</li>`).join('')}</ul></dd>
      </dl></article>`;
  const short=t=>t.replace(/^(가설|관점)\s*\d+\s*·\s*/,'');

  function convertHTML(n){
    const P=IL.persona(); const def={brief:'b',explainer:'x',cardnews:'c'}[P.format];
    const tab=(k,l)=>`<button type="button" data-cv="${k}" class="${k===def?'is-active':''}">${l}</button>`;
    const checks=[...new Set(n.hyps.flatMap(h=>h.check))];
    const srcN=(n.meta.sources||[]).length||'';
    const pal=['','','',''];
    return `<section class="lx-card ax-conv" aria-labelledby="cvT"><div class="lx-card__h"><h3 id="cvT">맞춤 전환</h3><span class="lx-ai">검수된 답변 기준</span></div>
      <div class="lx-card__b">
        <div class="tabs" id="cvTabs">${tab('b','기관 · 회의용 브리핑')}${tab('x','자문사 · 고객 설명자료')}${tab('c','HNW · 카드뉴스')}</div>
        <div class="ax-prev ${def==='b'?'on':''}" data-pv="b"><div class="ax-docprev">
          <div class="hd"><b>EUGENE RESEARCH · MEETING BRIEF</b><span>기준일 ${E(n.baseDate)}</span></div>
          <h4>${E(n.q)}</h4>
          <ol>${n.hyps.map(h=>`<li><b>${E(short(h.t))}(근거 ${E(h.strength)})</b> · ${E(h.view?h.view.text:'')}</li>`).join('')}</ol>
          <div class="ft">체크포인트: ${checks.map(E).join(' · ')} | 출처 ${srcN}쪽 · 투자 권유 아님</div></div></div>
        <div class="ax-prev ${def==='x'?'on':''}" data-pv="x"><div class="ax-docprev">
          <div class="hd"><b>고객 설명자료 · 자문사 배포용</b><span>기준일 ${E(n.baseDate)}</span></div>
          <h4>“${E(n.q)}”에 대한 설명</h4>
          <p style="margin-top:10px;font-size:13.5px;line-height:1.7">${E(n.verdict)}</p>
          <ul>${n.hyps.map(h=>`<li>${E(h.facts[0]?h.facts[0].text:short(h.t))}</li>`).join('')}<li>다음 확인 시점: ${E(checks[0]||'')}</li></ul>
          <div class="ft">유진투자증권 리서치센터 자료를 바탕으로 작성 · 투자 권유가 아닙니다</div></div></div>
        <div class="ax-prev ${def==='c'?'on':''}" data-pv="c"><div class="ax-cards">
          <div class="ax-cn"><span class="p">1/4</span><b>${E(n.q)}</b><span>유진 리서치 · 3분 요약</span></div>
          ${n.hyps.slice(0,2).map((h,i)=>`<div class="ax-cn"><span class="p">${i+2}/4</span><b>${E(short(h.t))}</b><span>근거 ${E(h.strength)}</span></div>`).join('')}
          <div class="ax-cn"><span class="p">4/4</span><b>다음 체크는<br/>${E(checks[0]||'')}</b><span>궁금하면 담당 PB에게</span></div></div></div>
        <div class="ax-conv__bar"><span class="ax-disc">애널리스트가 검수한 답변만 전환합니다. 외부 자동 발송은 시연 범위에서 제외했습니다.</span>
          <span style="display:flex;gap:8px"><button class="btn btn--secondary btn--sm" onclick="window.print()">PDF 저장</button><button class="btn btn--primary btn--sm" onclick="toast('내 자료함에 담았습니다.')">자료함에 담기</button></span></div>
      </div></section>`;
  }

  function nextHTML(){
    const P=IL.persona();
    const ev = P.seg==='WM' ? IL.EVENTS.find(e=>e.id==='e2') : IL.EVENTS.find(e=>e.id==='e1');
    return `<div class="ax-next">
      <button class="ax-act" type="button" data-ev="${ev.id}"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <div><b>관련 행사 신청</b><span>${ev.date} · ${E(ev.title)}</span></div></button>
      <button class="ax-act" type="button" data-cs><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg></span>
        <div><b>${E(P.contact)}에게 이어서 묻기</b><span>질문 맥락을 요약해 함께 전달</span></div></button></div>`;
  }

  function fullAnswer(n){
    const m=n.meta||{};
    return `<article class="lx-card ax-ans">
      <header class="ax-ans__h">
        <div class="ax-ans__meta"><span class="badge badge--neutral">${E(n.topic)}</span>${IL.statusBadge('reviewed')}${n.stale?IL.statusBadge('stale'):''}
          <span>검수 ${E(n.reviewer)} · ${E(n.reviewedAt)}</span>${n.baseDate?`<span>· 근거 기준일 ${E(n.baseDate)}</span>`:''}
          ${m.cite_total?`<span class="lx-st lx-st--ok" title="인용문을 리포트 원문과 대조한 결과">원문 대조 ${m.cite_ok}/${m.cite_total}</span>`:''}</div>
        <h2 class="ax-ans__q">${E(n.q)}</h2>
      </header>
      ${n.stale?`<div class="ax-stale" role="status"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>
        <div><b>재검토 필요 · 새 자료가 나왔습니다</b><p>${E(n.staleNote)}</p></div></div>`:''}
      <div class="ax-verdict"><div class="lx-eyebrow"><span class="lx-ai">AI</span>요약 · 결론을 단정하지 않습니다</div><p>${E(n.verdict)}</p></div>
      <div class="ax-hyps">${n.hyps.map(hypHTML).join('')}</div>
      <footer class="ax-foot"><p class="ax-disc">유진투자증권 리서치센터의 준법 승인 자료만 인용합니다. 정보 제공 목적이며 투자 권유가 아닙니다. 일반투자자의 상품 문의는 적합성 확인을 위해 담당 PB에게 연결됩니다.</p>
        <div class="ax-fb" role="group" aria-label="답변 평가">이 답변이 도움됐나요? <button type="button" data-fb="up">👍 도움됨</button><button type="button" data-fb="down">👎 부족함</button></div></footer>
    </article>${nextHTML()}${convertHTML(n)}`;
  }

  function progressView(n, note){
    const drafting=n.status==='drafting';
    const steps=[['접수',n.askedAt||'방금',1],['AI 초안',drafting?'작성 중…':'완료',drafting?2:1],['애널리스트 검수',drafting?'대기':'진행 중',drafting?0:2],['답변 공개','오늘 중',0]];
    const col=s=>s===1?['rgba(22,163,106,.08)','#11845a']:s===2?['rgba(49,130,246,.08)','var(--color-primary)']:['var(--surface-tint)','var(--color-muted)'];
    return `<article class="lx-card ax-ans"><header class="ax-ans__h">
      <div class="ax-ans__meta">${drafting?'<span class="lx-st lx-st--wait">AI 초안 작성 중</span>':IL.statusBadge('pending')}<span>${E(note||'오늘 중 답변')}</span></div>
      <h2 class="ax-ans__q">${E(n.q)}</h2></header>
      <div class="lx-card__b" style="padding:22px 24px">
        <ol class="ax-steps">${steps.map(([t,s,k],i)=>{const [bg,fg]=col(k);return `<li style="background:${bg}"><div style="color:${fg}">${i+1}. ${t}${k===2?' <i class="ax-spin"></i>':''}</div><div class="s">${E(s)}</div></li>`;}).join('')}</ol>
        <div class="ax-verdict" style="margin:18px 0 0"><div class="lx-eyebrow">왜 바로 답하지 않나요?</div>
          <p style="font-weight:500;font-size:14px">처음 들어온 질문은 AI가 유진 리포트 원문에서 근거를 찾아 초안을 쓰고, 애널리스트가 인용을 확인한 뒤 공개합니다. 근거가 부족하면 추측하지 않고 담당자에게 연결합니다.</p></div>
      </div></article>`;
  }

  function routeView(n){
    const P=IL.persona();
    const to={pb:'담당 PB',desk:'DMA 데스크'}[n.route]||P.contact;
    const title=n.status==='hold'?'근거가 부족해 답변을 보류했습니다':n.status==='error'?'지금은 AI 답변을 만들 수 없습니다':`${to}에게 연결했습니다`;
    const body=n.status==='error'
      ? (/공개 시연/.test(n.error)?n.error:/usage limit|한도/i.test(n.error)?'AI 사용 한도에 도달했습니다. 질문은 접수됐고, 담당자가 직접 안내드립니다.':'일시적인 오류입니다. 질문은 접수됐고, 담당자가 직접 안내드립니다.')
      : (n.routeReason||'승인된 자료에 근거가 부족합니다.');
    const badge=n.status==='hold'?IL.statusBadge('hold'):n.status==='error'?'<span class="lx-st lx-st--hold">접수됨</span>':'<span class="lx-st lx-st--ok">담당자 연결</span>';
    return `<article class="lx-card ax-ans"><header class="ax-ans__h">
      <div class="ax-ans__meta">${n.topic?`<span class="badge badge--neutral">${E(n.topic)}</span>`:''}${badge}<span>${E(n.askedAt)}</span></div>
      <h2 class="ax-ans__q">${E(n.q)}</h2></header>
      <div class="lx-card__b" style="padding:22px 24px">
        <div class="lx-eyebrow">${E(title)}</div>
        <div class="lx-ctx" style="font-size:14px;margin-top:8px">${E(body)}</div>
        <p class="ax-disc" style="margin-top:12px">AI는 매매를 권유하지 않으며, 승인된 자료에 근거가 없으면 추측해서 답하지 않습니다.</p>
      </div></article>${nextHTML()}`;
  }

  function renderView(n){
    clearTimeout(pollT);
    curN=n;
    let html;
    if(!n) html='<div class="lx-card lx-muted" style="padding:40px;text-align:center">왼쪽에서 질문을 고르거나 새로 물어보세요.</div>';
    else if(n.status==='reviewed') html=fullAnswer(n);
    else if(n.status==='drafting'||(n.status==='pending'&&(!n.route||n.route==='answer'))) html=progressView(n);
    else html=routeView(n);
    $('#view').innerHTML=html;
    if(window.wireTabsA11y) wireTabsA11y();
    if(live && n && n.status==='drafting') pollT=setTimeout(()=>openQ(n.id,true),4000);
  }

  /* ── 사이드 ── */
  function renderSide(){
    const PR=IL.PRESETS;
    $('#presets').innerHTML=PR.map(p=>`<button class="ax-p" data-preset="${E(p.q)}" data-mockid="${p.id}"><b>${E(p.q)}</b><span>${E(p.tag)}</span></button>`).join('');
    const items = live ? list.map(d=>({id:d.id,q:d.text,status:d.status,stale:d.stale,route:d.route}))
                       : Object.values(IL.ANSWERS).map(a=>({id:a.id,q:a.q,status:a.status,stale:a.stale&&a.stale.on}));
    const badge=x=>x.stale?IL.statusBadge('stale'):x.status==='drafting'?'<span class="lx-st lx-st--wait">AI 초안 작성 중</span>'
      :x.status==='routed'?'<span class="lx-st lx-st--ok">담당자 연결</span>':x.status==='error'?'<span class="lx-st lx-st--hold">접수됨</span>':IL.statusBadge(x.status);
    $('#mine').innerHTML=items.length?items.map(x=>`<button class="ax-p${String(x.id)===String(cur)?' on':''}" data-go="${x.id}"><b>${E(x.q)}</b><span>${badge(x)}</span></button>`).join('')
      :'<p class="ax-disc" style="padding:4px">아직 질문이 없습니다.</p>';
  }

  async function loadList(){ if(live){ try{ list=await ILAPI.questions(IL.persona().key); }catch(e){ list=[]; } } renderSide(); }

  async function openQ(id, silent){
    cur=id;
    if(!live){ renderView(mockNorm(id)||mockNorm('q1')); renderSide(); return; }
    try{
      const d=await ILAPI.question(id);
      renderView(ILAPI.normAnswer(d));
      if(!silent||d.status!=='drafting'){ await loadList(); }
      history.replaceState(null,'','?q='+id);
    }catch(e){ toast('질문을 불러오지 못했습니다: '+e.message); }
  }

  async function askNew(text){
    if(!live){ toast('로컬 서버가 꺼져 있어 예시 화면만 볼 수 있습니다.'); return; }
    try{
      const r=await ILAPI.ask(text, IL.persona().key);
      toast('질문을 접수했습니다. AI가 리포트 원문에서 근거를 찾는 중입니다.');
      await loadList(); openQ(r.id);
    }catch(e){ toast(e.message); }
  }

  /* ── 시작 ── */
  $('#modeHint').textContent = !live ? '서버 꺼짐 · 예시 데이터로 표시 중' : ILAPI.isStatic() ? '공개 시연 버전 · 검수된 답변만 제공 (실제 유진 리포트 기준)' : '새 질문은 AI 초안 → 애널리스트 검수 후 답변 · 실제 리포트 264건 기준';
  $('#demoSlot').appendChild(IL.personaBar(async()=>{ await loadList(); toast('시연 고객을 바꿨습니다. 전환 형식과 연결 담당자가 바뀝니다.'); if(curN) renderView(curN); }));
  await loadList();
  if(params.get('new')) askNew(params.get('new'));
  else if(live){
    const want=params.get('q');
    let id = want && /^\d+$/.test(want) ? want : null;
    if(!id){ const all=await ILAPI.questions().catch(()=>[]); const me=IL.persona().key; const rv=all.find(d=>d.status==='reviewed'&&d.persona===me)||all.find(d=>d.status==='reviewed'); id=rv&&rv.id; }
    id ? openQ(id) : renderView(null);
  } else openQ(params.get('q')||'q1');

  /* ── 이벤트 ── */
  const srcOv=$('#srcOv'), csOv=$('#csOv');
  const flat=s=>s.replace(/\s+/g,' ');
  document.addEventListener('click',async e=>{
    const go=e.target.closest('[data-go]'); if(go){ openQ(go.dataset.go); $('#view').scrollIntoView({behavior:'smooth',block:'start'}); return; }
    const pr=e.target.closest('[data-preset]'); if(pr){
      if(!live){ openQ(IL.ANSWERS[pr.dataset.mockid]?pr.dataset.mockid:'q1'); return; }
      const all=await ILAPI.questions().catch(()=>[]); const hit=all.find(d=>d.text===pr.dataset.preset&&d.status==='reviewed');
      hit ? openQ(hit.id) : askNew(pr.dataset.preset); return; }
    const sc=e.target.closest('.lx-cite'); if(sc){
      $('#srcK').textContent='리포트 원문 · '+(sc.dataset.page?sc.dataset.page+'쪽':'');
      if(live && sc.dataset.rid){
        $('#srcH').textContent='불러오는 중…'; $('#srcB').textContent=''; srcOv.classList.add('show');
        try{
          const p=await ILAPI.page(sc.dataset.rid, sc.dataset.page);
          $('#srcH').textContent=p.title;
          const t=flat(p.text), q=flat(sc.dataset.q||'');
          let i=q?t.indexOf(q):-1;
          if(i<0 && q.length>12) i=t.indexOf(q.slice(0,12));
          const a=Math.max(0,(i<0?0:i)-220), b=Math.min(t.length,(i<0?600:i+q.length+260));
          const body = i<0 ? E(t.slice(0,600)) : E(t.slice(a,i))+'<mark>'+E(t.slice(i,i+q.length))+'</mark>'+E(t.slice(i+q.length,b));
          $('#srcB').innerHTML=`<div class="ax-srcmeta">${E(p.author||'')} · 발간 ${E(p.published_at)} · ${sc.dataset.page}쪽</div><p>${a>0?'… ':''}${body}${b<t.length?' …':''}</p>`;
          $('#srcPdf').href=p.url+'#page='+sc.dataset.page;
        }catch(err){ $('#srcB').textContent='원문을 불러오지 못했습니다.'; }
      } else {
        const s=IL.SOURCES[sc.dataset.mock]||{}; $('#srcH').textContent=s.title||'';
        $('#srcB').innerHTML=`${E(s.by||'')} · 발간 ${E(s.date||'')}<br/><br/>시연용 예시 자료입니다. 로컬 서버를 켜면 실제 리포트 원문이 표시됩니다. <span class="lx-proto">예시</span>`;
        $('#srcPdf').removeAttribute('href'); srcOv.classList.add('show');
      }
      return; }
    const cv=e.target.closest('[data-cv]'); if(cv){ document.querySelectorAll('#cvTabs button').forEach(b=>b.classList.toggle('is-active',b===cv));
      document.querySelectorAll('.ax-prev').forEach(p=>p.classList.toggle('on',p.dataset.pv===cv.dataset.cv)); if(window.wireTabsA11y) wireTabsA11y(); return; }
    const fb=e.target.closest('[data-fb]'); if(fb){ fb.parentNode.querySelectorAll('[data-fb]').forEach(b=>b.classList.toggle('on',b===fb));
      if(live&&curN) ILAPI.feedback(curN.id, fb.dataset.fb, IL.persona().key).catch(()=>{});
      toast('평가를 남겼습니다. 답변 품질 개선에 씁니다.'); return; }
    const ev=e.target.closest('[data-ev]'); if(ev){ if(live) ILAPI.applyEvent(ev.dataset.ev, IL.persona().key).catch(()=>{});
      toast('신청했습니다. 일정 하루 전 알림을 보내드려요.'); return; }
    if(e.target.closest('[data-cs]')){ const P=IL.persona(); const n=curN||{};
      $('#csCtx').innerHTML=`<b>${E(P.name)} · ${E(P.org)}</b> (${P.seg} · ${E(P.type)})<br/>질문: “${E(n.q||'')}”${n.verdict?`<br/>AI 답변 요약: ${E(n.verdict)}`:''}<br/>받는 사람: <b>${E(P.contact)}</b>`;
      csOv.classList.add('show'); return; }
    [srcOv,csOv].forEach(ov=>{ if(e.target===ov||(ov.contains(e.target)&&e.target.closest('[data-x]'))) ov.classList.remove('show'); });
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ srcOv.classList.remove('show'); csOv.classList.remove('show'); }});
  $('#csGo').addEventListener('click',async()=>{ const P=IL.persona(), n=curN||{};
    if(live) await ILAPI.consult({persona:P.key, kind:'질문 후속 상담', question_id:n.id, context:`“${n.q||''}” · ${n.verdict||''}`, memo:$('#csMemo').value}).catch(()=>{});
    csOv.classList.remove('show'); $('#csMemo').value=''; toast(`${P.contact}에게 요청을 보냈습니다.`); });
  $('#compose').addEventListener('submit',()=>{ const v=$('#qIn').value.trim(); if(v.length<4){toast('질문을 4자 이상 입력해 주세요.');return;}
    $('#qIn').value=''; askNew(v); });
})();
</script>
</body>
</html>
