<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 A · 리서치 터미널 — 유진 Insight Lab</title>
<link rel="preload" href="../assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="../assets/app.css" />
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-display:swap;src:url("../assets/fonts/PretendardVariable.woff2") format("woff2-variations")}
:root{
  --t-ink:#0d0f12; --t-body:#2a2f36; --t-muted:#5b6573; --t-faint:#8a929d;
  --t-line:#e4e8ee; --t-line-strong:#cfd6df; --t-ground:#ffffff; --t-wash:#f5f7fa;
  --t-up:#d22a40; --t-down:#1747a6; --t-accent:#1b64da; --t-accent-ink:#0f4fb8;
  --t-ease:cubic-bezier(.16,1,.3,1);
}
::selection{background:#d9e6fb;color:var(--t-ink)}
body{background:var(--t-ground);color:var(--t-body);word-break:keep-all;overflow-wrap:anywhere}
.nw{white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--t-up)} .down{color:var(--t-down)}

/* ── status rail ── */
.trail{border-bottom:1px solid var(--t-line);background:var(--t-wash)}
.trail__in{max-width:1320px;margin:0 auto;padding:0 40px;height:44px;display:flex;align-items:center;gap:20px;font-size:13px;color:var(--t-muted)}
.sess{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--t-ink)}
.sess i{width:8px;height:8px;border-radius:50%;background:var(--t-faint)}
.sess[data-k=open] i{background:var(--t-up);box-shadow:0 0 0 0 rgba(210,42,64,.5);animation:tPulse 2s var(--t-ease) infinite}
.sess[data-k=pre] i{background:#e8a317}
@keyframes tPulse{to{box-shadow:0 0 0 7px rgba(210,42,64,0)}}
.trail__sep{width:1px;height:14px;background:var(--t-line-strong)}
.trail__sp{flex:1}
.trail a{color:var(--t-body);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.trail a:hover{color:var(--t-accent-ink)}
.trail a svg{width:14px;height:14px}

/* ── board ── */
.board{max-width:1320px;margin:0 auto;padding:40px 40px 56px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:48px;align-items:start}
.lead__date{font-size:14px;font-weight:600;color:var(--t-muted);margin-bottom:14px}
.lead h1{font-size:clamp(28px,3.1vw,44px);line-height:1.28;letter-spacing:-.025em;font-weight:700;color:var(--t-ink);margin:0;text-wrap:balance;max-width:22em}
.lead h1 .n{font-weight:800}
.lead__acts{display:flex;align-items:center;gap:20px;margin-top:28px;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:12px;background:var(--t-ink);color:#fff;font:700 16px/1 inherit;font-family:inherit;border:0;cursor:pointer;text-decoration:none;transition:transform .16s var(--t-ease),background .2s}
.tbtn:hover{background:#23272e}.tbtn:active{transform:scale(.97)}
.tbtn .cnt{background:rgba(255,255,255,.16);border-radius:6px;padding:4px 7px;font-size:13px}
.tlink{font-weight:700;font-size:15px;color:var(--t-accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:12px 0;text-underline-offset:4px}
.tlink:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--t-accent);outline-offset:3px;border-radius:6px}

/* quote board */
.quotes{margin-top:40px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--t-ink);border-bottom:1px solid var(--t-line)}
.q{padding:16px 18px 18px;border-left:1px solid var(--t-line);min-width:0}
.q:first-child{border-left:0;padding-left:0}
.q__n{font-size:13px;font-weight:700;color:var(--t-muted);display:flex;justify-content:space-between}
.q__n small{font-weight:600;color:var(--t-faint);font-size:12px}
.q__v{font-size:clamp(20px,1.75vw,26px);font-weight:800;color:var(--t-ink);letter-spacing:-.02em;margin-top:8px;line-height:1;white-space:nowrap}
.q__c{font-size:15px;font-weight:700;margin-top:8px;display:flex;align-items:center;gap:6px}
.q__c svg{width:10px;height:10px;fill:currentColor}

/* flows + sectors */
.lower{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;margin-top:36px}
.blk__h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.blk__h h2{font-size:16px;font-weight:800;color:var(--t-ink);margin:0}
.seg{display:inline-flex;background:var(--t-wash);border:1px solid var(--t-line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;font:700 13px inherit;font-family:inherit;color:var(--t-muted);padding:0 12px;height:30px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--t-ink);box-shadow:0 1px 2px rgba(13,15,18,.08),0 2px 8px rgba(13,15,18,.06)}
.flow{display:grid;grid-template-columns:52px 1fr 92px;align-items:center;gap:12px;height:40px;border-bottom:1px solid var(--t-line)}
.flow:last-child{border-bottom:0}
.flow b{font-size:14px;color:var(--t-ink)}
.flow__track{position:relative;height:12px}
.flow__track::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:var(--t-line-strong)}
.flow__track i{position:absolute;top:0;height:12px;border-radius:3px;transition:width .7s var(--t-ease),left .7s var(--t-ease)}
.flow__track i.up{background:var(--t-up)} .flow__track i.down{background:var(--t-down)}
.flow span{text-align:right;font-weight:800;font-size:15px}
.sect{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.sect h3{font-size:13px;font-weight:700;color:var(--t-muted);margin:0 0 6px}
.sect li{list-style:none;display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--t-line);font-size:14px;color:var(--t-ink);font-weight:600}
.sect li:last-child{border-bottom:0}
.sect ul{margin:0;padding:0}

/* ── briefing rail ── */
.rail{border-left:1px solid var(--t-line);padding-left:40px;display:flex;flex-direction:column;gap:28px}
.anchor{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:stretch}
.anchor__v{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#1b1d21;cursor:pointer;border:0;padding:0}
.anchor__v video,.anchor__v img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.anchor__v .pl{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;transition:transform .2s var(--t-ease),opacity .2s}
.anchor__v .pl svg{width:16px;height:16px;fill:var(--t-ink);margin-left:2px}
.anchor__v:hover .pl{transform:scale(1.08)}
.anchor__v.is-playing .pl{opacity:0}
.anchor__v .dur{position:absolute;right:8px;bottom:8px;background:rgba(13,15,18,.72);color:#fff;font-size:11px;font-weight:700;padding:3px 6px;border-radius:5px}
.anchor__meta{display:flex;flex-direction:column;min-width:0}
.anchor__tabs{display:flex;gap:4px;margin-bottom:12px}
.anchor__tabs button{border:1px solid var(--t-line);background:#fff;border-radius:999px;height:30px;padding:0 12px;font:700 12px inherit;font-family:inherit;color:var(--t-muted);cursor:pointer}
.anchor__tabs button[aria-pressed=true]{background:var(--t-ink);border-color:var(--t-ink);color:#fff}
.anchor__meta h2{font-size:17px;font-weight:800;color:var(--t-ink);margin:0 0 8px;line-height:1.35}
.anchor__line{font-size:14px;line-height:1.6;color:var(--t-body);margin:0;min-height:4.8em;transition:opacity .25s}
.anchor__prog{margin-top:auto;height:3px;background:var(--t-line);border-radius:2px;overflow:hidden}
.anchor__prog i{display:block;height:100%;width:0;background:var(--t-ink)}
.list h2{font-size:16px;font-weight:800;color:var(--t-ink);margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.list h2 a{font-size:13px;color:var(--t-accent-ink);font-weight:700;text-decoration:none;padding:8px 0}
.list h2 a:hover{text-decoration:underline}
.row{display:block;padding:13px 0;border-bottom:1px solid var(--t-line);text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
a.row:hover .row__t{color:var(--t-accent-ink)}
.row__k{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;color:var(--t-muted)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--t-wash);color:var(--t-body)}
.chip.up{background:#fdecef;color:var(--t-up)} .chip.down{background:#eaf0fb;color:var(--t-down)}
.row__t{font-size:15px;font-weight:700;color:var(--t-ink);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:color .15s}
.row__s{font-size:13px;color:var(--t-muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{font-size:14px;color:var(--t-muted);padding:14px 0}
.src{font-size:12px;color:var(--t-faint);margin-top:18px}

/* skeleton */
.sk{background:linear-gradient(90deg,#eef1f5 0,#f7f9fb 50%,#eef1f5 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:6px;color:transparent!important}
@keyframes sk{to{background-position:-200% 0}}

/* next section peek */
.peek{border-top:1px solid var(--t-line);background:var(--t-wash);padding:32px 40px;text-align:center;font-size:14px;color:var(--t-muted)}

@media (max-width:1080px){
  .board{grid-template-columns:1fr;gap:36px}
  .rail{border-left:0;padding-left:0;border-top:1px solid var(--t-line);padding-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
  .rail .anchor{grid-column:1/-1}
}
@media (max-width:720px){
  .trail__in{padding:0 16px;gap:12px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  .trail__in::-webkit-scrollbar{display:none}
  .board{padding:24px 16px 40px}
  .quotes{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}
  .q,.q:first-child{padding:14px 0;border-left:0;border-top:1px solid var(--t-line)}
  .q:first-child{grid-column:1/-1;border-top:0}
  .q:first-child .q__v{font-size:34px}
  .q__v{font-size:22px}
  .lower{grid-template-columns:1fr;gap:28px}
  .rail{grid-template-columns:1fr}
  .anchor{grid-template-columns:112px 1fr}
  .lead__acts .tbtn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="nav">
  <div class="nav__brand">
    <img class="nav__logoimg" src="../assets/eugene-logo.png" alt="유진투자증권" />
    <span class="nav__divider"></span>
    <span class="nav__sub">Insight Lab</span>
  </div>
  <nav class="nav__links">
    <a href="../market.html">시황·테마</a><a href="../reports.html">리서치 리포트</a><a href="../events.html">종목 이벤트</a>
    <a href="../global.html">해외 AI 리서치</a><a href="../quant.html">퀀트 투자</a><a href="#">인사이트</a>
  </nav>
  <div class="nav__spacer"></div>
  <div class="nav__auth"><span style="display:inline-flex;align-items:center;gap:12px">
    <button class="btn btn--text" style="font-size:var(--text-body)">로그인</button>
    <button class="btn btn--primary btn--sm">회원가입</button></span></div>
</header>

<main>
<div class="trail" role="region" aria-label="시장 상태">
  <div class="trail__in">
    <span class="sess" id="sess" data-k="closed"><i aria-hidden="true"></i><span>장 상태</span></span>
    <span class="trail__sep" aria-hidden="true"></span>
    <span id="asof" class="tnum">— 기준</span>
    <span class="trail__sp"></span>
    <a href="../trading/index.html">AI Trading League <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
  </div>
</div>

<section class="board" aria-labelledby="headline">
  <div class="lead">
    <div class="lead__date" id="dateKo">&nbsp;</div>
    <h1 id="headline"><span class="sk">코스피와 코스닥의 오늘 흐름을 불러오는 중입니다</span></h1>
    <div class="lead__acts">
      <a class="tbtn" href="../reports.html" id="ctaReports">오늘의 리포트 보기 <span class="cnt tnum" id="repCnt">–</span></a>
      <a class="tlink" href="../market.html">시황·수급 자세히 <span aria-hidden="true">→</span></a>
    </div>

    <div class="quotes" id="quotes" role="list" aria-label="주요 지수"></div>

    <div class="lower">
      <div class="blk">
        <div class="blk__h"><h2>투자자별 순매수</h2>
          <div class="seg" role="group" aria-label="시장 선택">
            <button type="button" data-m="kospi" aria-pressed="true">코스피</button><button type="button" data-m="kosdaq" aria-pressed="false">코스닥</button>
          </div></div>
        <div id="flows"></div>
      </div>
      <div class="blk">
        <div class="blk__h"><h2>업종 등락</h2></div>
        <div class="sect">
          <div><h3>강세</h3><ul id="strong"></ul></div>
          <div><h3>약세</h3><ul id="weak"></ul></div>
        </div>
      </div>
    </div>
  </div>

  <aside class="rail" aria-label="오늘의 브리핑">
    <div class="anchor">
      <button class="anchor__v" id="aVid" type="button" aria-label="AI 앵커 브리핑 재생">
        <video id="aVideo" playsinline preload="metadata" crossorigin="anonymous"></video>
        <span class="pl" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        <span class="dur tnum" id="aDur">–</span>
      </button>
      <div class="anchor__meta">
        <div class="anchor__tabs" id="aTabs" role="group" aria-label="브리핑 선택"></div>
        <h2 id="aTitle">AI 앵커 브리핑</h2>
        <p class="anchor__line" id="aLine" aria-live="polite"></p>
        <div class="anchor__prog" aria-hidden="true"><i id="aProg"></i></div>
      </div>
    </div>
    <div class="list">
      <h2>새 리포트 <a href="../reports.html">전체 →</a></h2>
      <div id="reps"></div>
    </div>
    <div class="list">
      <h2>주요 공시 <a href="../events.html">전체 →</a></h2>
      <div id="evs"></div>
    </div>
  </aside>
</section>
<div class="peek">↓ 아래로 리서치 리포트 · 테마 · 퀀트 섹션이 이어집니다 (시안 비교용 표시)</div>
</main>

<script src="hero-data.js"></script>
<script>
(async function(){
  const $=s=>document.querySelector(s), {num,dir,signed,pct,fmt,eok,dateKo,mmdd,session,sentences,reduced}=HD;
  const tri=d=>`<svg viewBox="0 0 10 10" aria-hidden="true"><path d="${d==='up'?'M5 1 9 8H1z':'M5 9 1 2h8z'}"/></svg>`;
  const s=session(); $('#sess').dataset.k=s.key; $('#sess span').textContent=s.label;

  const D=await loadHeroData(), m=D.market;
  $('#asof').textContent=`${mmdd(m.date)} 종가 기준`+(D.live?'':' · 예시 데이터');
  $('#dateKo').textContent=dateKo(m.date)+' 마감';

  /* headline — composed from the numbers, not from a marketing line */
  const kd=dir(m.kospi_chg), qd=dir(m.kosdaq_chg), f=m.flows&&m.flows.kospi;
  const st=(m.strong||[]).slice(0,2).map(x=>x.name), wk=(m.weak||[]).slice(0,2).map(x=>x.name);
  let h=`코스피 <span class="n ${kd} tnum">${signed(m.kospi_chg)}</span>, 코스닥 <span class="n ${qd} tnum">${signed(m.kosdaq_chg)}</span>.`;
  if(f&&f.foreign) h+=` 외국인 ${eok(f.foreign).replace(/^[+−]/,'')} ${dir(f.foreign)==='up'?'순매수':'순매도'}`;
  const nw=a=>a.map((x,i)=>`<span class="nw">${x}${i<a.length-1?'·':''}</span>`).join('');
  if(st.length) h+=`${f&&f.foreign?' 속 ':' '}${nw(st)} 강세`;
  if(wk.length) h+=`, ${nw(wk)} 약세.`;
  $('#headline').innerHTML=h;

  /* quote board */
  const g=n=>(D.globals||[]).find(x=>x.name===n);
  const items=[
    {n:'코스피',k:'KOSPI',v:m.kospi,c:m.kospi_chg},
    {n:'코스닥',k:'KOSDAQ',v:m.kosdaq,c:m.kosdaq_chg},
    {n:'원/달러',k:'USD/KRW',v:m.usdkrw,c:m.usdkrw_chg},
    g('NASDAQ')&&{n:'나스닥',k:'NASDAQ',v:fmt(g('NASDAQ').price),c:pct(g('NASDAQ').change_pct)},
    g('S&P 500')&&{n:'S&P 500',k:'미국',v:fmt(g('S&P 500').price),c:pct(g('S&P 500').change_pct)}
  ].filter(Boolean);
    $('#quotes').innerHTML=items.map(i=>{const d=dir(i.c);
    return `<div class="q" role="listitem"><div class="q__n">${i.n}<small>${i.k}</small></div>
      <div class="q__v tnum" data-v="${i.v}">${i.v}</div>
      <div class="q__c ${d} tnum">${tri(d)}${signed(i.c).replace(/^[+−]/,'')}</div>
      </div>`;}).join('');

  /* investor flows — diverging bars */
  function flows(mk){
    const fl=(m.flows||{})[mk]||{}, rows=[['외국인',fl.foreign],['기관',fl.inst],['개인',fl.retail]].filter(r=>r[1]);
    const mx=Math.max(...rows.map(r=>Math.abs(num(r[1]))),1);
    $('#flows').innerHTML=rows.map(([n,v])=>{const d=dir(v),w=Math.abs(num(v))/mx*48;
      return `<div class="flow"><b>${n}</b><div class="flow__track" role="img" aria-label="${n} ${eok(v)}"><i class="${d}" data-w="${w}" style="width:0;left:50%"></i></div><span class="${d} tnum">${eok(v)}</span></div>`;}).join('');
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#flows i').forEach(i=>{
      const w=+i.dataset.w; i.style.width=w+'%'; if(i.classList.contains('down')) i.style.left=(50-w)+'%';})));
  }
  flows('kospi');
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); flows(b.dataset.m);}));
  const li=a=>a.map(x=>`<li>${x.name}<span class="${dir(x.chg)} tnum">${signed(x.chg)}</span></li>`).join('')||'<li>—</li>';
  $('#strong').innerHTML=li(m.strong||[]); $('#weak').innerHTML=li(m.weak||[]);

  /* reports + events */
  $('#repCnt').textContent=(D.reports||[]).length||'0';
  $('#reps').innerHTML=(D.reports||[]).slice(0,3).map(r=>`<a class="row" href="${r.url||'../reports.html'}" target="_blank" rel="noopener">
      <div class="row__k">${r.category?`<span class="chip">${r.category}</span>`:''}${r.rating?`<span class="chip ${/buy|매수/i.test(r.rating)?'up':''}">${r.rating}</span>`:''}<span class="tnum">${mmdd(r.date)}</span></div>
      <div class="row__t">${r.title}</div>${r.company||r.analyst?`<div class="row__s">${[r.company,r.analyst&&r.analyst+' 애널리스트'].filter(Boolean).join(' · ')}</div>`:''}</a>`).join('')
    ||'<div class="empty">오늘 새로 올라온 리포트를 정리하고 있어요.</div>';
  $('#evs').innerHTML=(D.events||[]).slice(0,3).map(e=>`<div class="row"><div class="row__k">${e.tag?`<span class="chip ${e.tone||''}">${e.tag}</span>`:''}<span class="tnum">${e.date||''}</span></div>
      <div class="row__t">${e.name}</div>${e.detail?`<div class="row__s">${e.detail}</div>`:''}</div>`).join('')
    ||'<div class="empty">새 공시가 없어요.</div>';

  /* AI anchor — inline player with script-synced lines */
  const v=$('#aVideo'), box=$('#aVid'); let cur=0, lines=[], spans=[];
  const B=D.briefings.length?D.briefings:[];
  $('#aTabs').innerHTML=B.map((b,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===0}">${b.kind==='market'?'시황':'리포트'} ${mmdd(b.brief_date)}</button>`).join('');
  function load(i){
    cur=i; const b=B[i]; if(!b) return;
    v.src=b.video_url; if(b.thumbnail_url) v.poster=b.thumbnail_url;
    $('#aTitle').textContent=b.kind==='market'?'오늘의 시황, AI 앵커 브리핑':'오늘의 리포트, AI 앵커 브리핑';
    lines=sentences(b.script); $('#aLine').textContent=lines[1]||lines[0]||'';
    box.classList.remove('is-playing'); $('#aProg').style.width='0';
    document.querySelectorAll('#aTabs button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.i===i));
  }
  v.addEventListener('loadedmetadata',()=>{ $('#aDur').textContent=`0:${String(Math.round(v.duration)).padStart(2,'0')}`;
    const tot=lines.reduce((a,l)=>a+l.length,0); let acc=0; spans=lines.map(l=>{const s0=acc/tot*v.duration; acc+=l.length; return [s0,acc/tot*v.duration];}); });
  v.addEventListener('timeupdate',()=>{ $('#aProg').style.width=(v.currentTime/v.duration*100)+'%';
    const k=spans.findIndex(([a,b])=>v.currentTime>=a&&v.currentTime<b); if(k>=0&&$('#aLine').textContent!==lines[k]) $('#aLine').textContent=lines[k]; });
  v.addEventListener('ended',()=>box.classList.remove('is-playing'));
  box.addEventListener('click',()=>{ if(v.paused){v.play();box.classList.add('is-playing');box.setAttribute('aria-label','브리핑 일시정지');} else {v.pause();box.classList.remove('is-playing');box.setAttribute('aria-label','AI 앵커 브리핑 재생');} });
  $('#aTabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) load(+b.dataset.i);});
  load(0);

  /* one-time count-up on the quote board */
  if(!reduced()) document.querySelectorAll('.q__v').forEach(el=>{
    const raw=el.dataset.v.replace(/,/g,''), n=parseFloat(raw), dec=(raw.split('.')[1]||'').length; if(isNaN(n)) return;
    const t0=performance.now(); (function tick(t){const p=Math.min(1,(t-t0)/900), e=1-Math.pow(2,-10*p);
      el.textContent=(n*(.92+.08*e)).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); if(p<1) requestAnimationFrame(tick); else el.textContent=el.dataset.v;})(t0);
  });
})();
</script>
</body>
</html>
