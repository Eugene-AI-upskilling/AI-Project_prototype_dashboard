<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coinone · 안전하게 시작하는 디지털 자산 투자</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--white); }
  .cn-toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--ink-900); color: #fff; padding: 12px 18px; border-radius: var(--radius-md);
    font-size: var(--text-body); font-weight: 600; box-shadow: var(--shadow-pop); z-index: 2000;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="MarketingNav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel">
  function App() {
    const [toast, setToast] = React.useState(null);
    const join = () => {
      setToast("인증 메일을 보냈어요. 메일함을 확인해 주세요.");
      setTimeout(() => setToast(null), 2600);
    };
    return (
      <div>
        <MarketingNav />
        <Hero />
        <Features />
        <SignupCTA onJoin={join} />
        <MarketingFooter />
        {toast && <div className="cn-toast">{toast}</div>}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
