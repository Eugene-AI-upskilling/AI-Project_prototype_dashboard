<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Insight Lab Showreel · Long Cut</title>
<style>
@font-face{font-family:Pretendard;src:url(PretendardVariable.woff2) format('woff2-variations');font-weight:45 920;font-display:block}
html,body{margin:0;background:#000;height:100%}
canvas{display:block;width:100vw;max-height:100vh;object-fit:contain;margin:auto}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ───────── Eugene Insight Lab · showreel long cut (39s) ─────────
   Based on the 15s reel.html. Deterministic timeline: render(t) draws the frame at time t.
   window.renderFrame(i, fps, samples) = motion-blurred frame for the encoder.
   Scenes (120 BPM, every cut on a beat):
     A  0.0  drop & impact            G 19.5  floating phone · AI anchor
     B  1.5  kinetic type             H 25.5  theme bubbles
     C  4.0  glass shapes title       J 27.5  diagonal collage
     D  8.5  market chart → 9,000     K 32.0  logo resolve
     E 11.0  product board
     F 15.0  isometric product wall */
const W = 1920, H = 1080, DUR = 39, CX = W / 2, CY = H / 2;
const cv = document.getElementById('c');
const out = cv.getContext('2d');
const work = document.createElement('canvas'); work.width = W; work.height = H;
const ctx = work.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
const tctx = tmp.getContext('2d');

const C = {
  ink: '#05060a', ink2: '#0d1017', red: '#d21f23', redHi: '#ff3b45', redDeep: '#7a0b10',
  up: '#ff4458', down: '#3d7bff', blue: '#1b74e4', bluePt: '#4dabf7', navy: '#0b2e6b',
  white: '#ffffff', paper: '#f4f6f9', tint: '#eaf0f6', gray: '#8d9299', muted: '#6b7684', body: '#17181b'
};
const F = (w, s) => `${w} ${s}px Pretendard`;

/* ───────── math ───────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
};
// damped spring step response, e = seconds since start
function spring(e, zeta = .5, w = 14) {
  if (e <= 0) return 0;
  const wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * e) * (Math.cos(wd * e) + zeta * w / wd * Math.sin(wd * e));
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt2 = v => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ───────── shared assets ───────── */
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'), id = g.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); }
let FRAME = 0, GT = 0;

function bg(col) { ctx.fillStyle = col; ctx.fillRect(-W, -H, W * 3, H * 3); }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function textSpaced(c, str, x, y, spacing, align = 'left') {
  const widths = [...str].map(ch => c.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (widths.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const prev = c.textAlign; c.textAlign = 'left';
  [...str].forEach((ch, i) => { c.fillText(ch, cx, y); cx += widths[i] + spacing; });
  c.textAlign = prev; return total;
}
// masked line rise: text slides up from below a clip line
function riseText(c, str, x, y, p, size, align = 'left') {
  c.save(); c.beginPath(); c.rect(-W, y - size * 1.05, W * 3, size * 1.32); c.clip();
  c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(str, x, y + (1 - p) * size * 1.3); c.restore();
}

/* Eugene globe — stylised from the logo mark: red sphere, silver swirl */
function swirlPaths(c, r) {
  c.moveTo(r * .05, -r * 1.05);
  c.bezierCurveTo(r * .9, -r * .95, r * 1.15, -r * .1, r * .62, r * .18);
  c.bezierCurveTo(r * .35, r * .32, r * .25, -r * .1, r * .42, -r * .35);
  c.bezierCurveTo(r * .5, -r * .55, r * .2, -r * .62, r * .05, -r * 1.05);
  c.moveTo(-r * 1.05, r * .1);
  c.bezierCurveTo(-r * .9, -r * .75, -r * .3, -r * .8, -r * .22, -r * .38);
  c.bezierCurveTo(-r * .15, -r * .05, -r * .55, -r * .05, -r * .52, r * .22);
  c.bezierCurveTo(-r * .5, r * .45, -r * .85, r * .55, -r * 1.05, r * .1);
}
function sphere(c, x, y, r, sx = 1, sy = 1, rot = 0) {
  if (r <= .5) return;
  c.save(); c.translate(x, y); c.scale(sx, sy);
  const g = c.createRadialGradient(-r * .35, -r * .4, r * .05, 0, 0, r);
  g.addColorStop(0, '#ff6b70'); g.addColorStop(.45, C.red); g.addColorStop(1, '#8e0d12');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
  c.save(); c.clip(); c.rotate(rot);
  const s = c.createLinearGradient(-r, -r, r, r);
  s.addColorStop(0, '#f2f3f5'); s.addColorStop(1, '#b9bdc4');
  c.fillStyle = s; c.beginPath(); swirlPaths(c, r); c.fill();
  c.restore();
  c.fillStyle = 'rgba(255,255,255,.35)';
  c.beginPath(); c.ellipse(-r * .38, -r * .45, r * .22, r * .12, -.6, 0, Math.PI * 2); c.fill();
  c.restore();
}

/* ───────── HUD (reel chrome) ───────── */
function hud(_t, light, a = 1) {
  if (a <= 0) return;
  const col = light ? `rgba(5,6,10,${.55 * a})` : `rgba(255,255,255,${.55 * a})`;
  ctx.save(); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.font = F(600, 18); ctx.textBaseline = 'top';
  textSpaced(ctx, 'EUGENE INSIGHT LAB — SHOWREEL 2026', 64, 52, 3);
  const s = Math.floor(GT), f = Math.floor(GT * 60) % 60;
  const tc = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}:${String(f).padStart(2, '0')}`;
  textSpaced(ctx, tc, W - 64, 52, 3, 'right');
  const m = 26;
  [[48, 96], [W - 48, 96], [48, H - 48], [W - 48, H - 48]].forEach(([x, y], i) => {
    const sx = i % 2 ? -1 : 1, sy = i < 2 ? 1 : -1;
    ctx.beginPath(); ctx.moveTo(x, y + sy * m); ctx.lineTo(x, y); ctx.lineTo(x + sx * m, y); ctx.stroke();
  });
  ctx.fillRect(64, H - 66, (W - 128) * (GT / DUR), 2);
  ctx.restore();
}

/* ═════════ A · drop & impact (0 – 1.5) — original ═════════ */
function s1(t) {
  bg(C.ink);
  const R = 72;
  let y = CY, sx = 1, sy = 1;
  if (t < .6) {
    const p = t / .6; y = lerp(-180, CY, p * p); sy = 1 + .38 * p * p; sx = 1 - .18 * p * p;
    const tail = 420 * p;
    const g = ctx.createLinearGradient(0, y - tail, 0, y);
    g.addColorStop(0, 'rgba(210,31,35,0)'); g.addColorStop(1, 'rgba(255,80,85,.55)');
    ctx.fillStyle = g; ctx.fillRect(CX - R * .55, y - tail, R * 1.1, tail);
  } else {
    const k = 1 - spring(t - .6, .28, 26); sx = 1 + .5 * k; sy = 1 - .5 * k;
  }
  for (let i = 0; i < 4; i++) {
    const e = (t - .6 - i * .065) / .9;
    if (e <= 0 || e >= 1) continue;
    ctx.beginPath(); ctx.arc(CX, CY, R + E.outExpo(e) * (1250 - i * 180), 0, Math.PI * 2);
    ctx.lineWidth = lerp(16 - i * 3, .5, e);
    ctx.strokeStyle = i % 2 ? `rgba(255,255,255,${(1 - e) * .5})` : `rgba(255,59,69,${(1 - e) * .9})`;
    ctx.stroke();
  }
  const r = rng(11);
  for (let i = 0; i < 70; i++) {
    const a = r() * Math.PI * 2, sp = 300 + r() * 900, e = t - .6;
    if (e <= 0) break;
    const d = sp * (1 - Math.exp(-e * 3.2)) / 3.2 * 2.2;
    ctx.fillStyle = `rgba(255,${120 + r() * 120 | 0},${110 + r() * 60 | 0},${clamp(1 - e / .85)})`;
    ctx.beginPath(); ctx.arc(CX + Math.cos(a) * (R + d), CY + Math.sin(a) * (R + d) * .8, 1.5 + r() * 3.5, 0, 7); ctx.fill();
  }
  const grow = 1 + E.inExpo(prog(t, 1.18, 1.5)) * 26;
  sphere(ctx, CX, y, R * grow, sx, sy, t * 2.2);
  if (t > .82) {
    const a = prog(t, .82, 1.05) * (1 - prog(t, 1.15, 1.25));
    ctx.fillStyle = `rgba(255,255,255,${a * .8})`; ctx.font = F(600, 22); ctx.textBaseline = 'middle';
    textSpaced(ctx, 'EUGENE INVESTMENT & SECURITIES · RESEARCH CENTER', CX, CY + 165, lerp(26, 8, E.outExpo(prog(t, .82, 1.2))), 'center');
  }
  if (t >= .6) { ctx.fillStyle = `rgba(255,255,255,${(1 - prog(t, .6, .7)) * .55})`; ctx.fillRect(0, 0, W, H); }
}

/* ═════════ B · kinetic type (1.5 – 4.0) — original ═════════ */
const WORDS = [
  { t: 1.5, txt: '데이터를', bg: C.red, fg: '#fff', sub: 'DATA' },
  { t: 2.0, txt: '읽고', bg: C.ink, fg: C.redHi, sub: 'READ' },
  { t: 2.5, txt: '해석하고', bg: C.paper, fg: C.ink, sub: 'INTERPRET' },
  { t: 3.0, txt: '움직인다.', bg: C.blue, fg: '#fff', sub: 'MOVE' }
];
function s2(t) {
  if (t < 3.5) {
    const i = Math.min(3, Math.floor((t - 1.5) / .5)), w = WORDS[i], e = t - w.t;
    bg(w.bg);
    const light = w.bg === C.paper;
    ctx.save(); ctx.font = F(900, 760); ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = light ? 'rgba(5,6,10,.045)' : 'rgba(255,255,255,.07)';
    ctx.fillText(`0${i + 1}`, W + 40 - E.outExpo(clamp(e / .5)) * 60, H + 120); ctx.restore();
    ctx.save(); ctx.font = F(900, 290); ctx.textBaseline = 'alphabetic';
    const chars = [...w.txt], ws = chars.map(ch => ctx.measureText(ch).width);
    const total = ws.reduce((a, b) => a + b, 0) - 8 * (chars.length - 1);
    let x = CX - total / 2; const base = CY + 100;
    ctx.beginPath(); ctx.rect(0, base - 300, W, 380); ctx.clip();
    chars.forEach((ch, k) => {
      const p = E.outExpo(clamp((e - k * .032) / .3));
      ctx.save(); ctx.translate(x + ws[k] / 2, base + (1 - p) * 330);
      ctx.rotate((1 - p) * .18); ctx.scale(1 + (1 - p) * .2, 1);
      ctx.fillStyle = w.fg; ctx.textAlign = 'center'; ctx.fillText(ch, 0, 0); ctx.restore();
      x += ws[k] - 8;
    });
    ctx.restore();
    ctx.fillStyle = light ? C.muted : 'rgba(255,255,255,.75)'; ctx.font = F(700, 24); ctx.textBaseline = 'middle';
    const sa = prog(e, .08, .25); ctx.globalAlpha = sa;
    textSpaced(ctx, `${w.sub}  —  0${i + 1} / 04`, CX, base + 95, 10, 'center'); ctx.globalAlpha = 1;
    if (i > 0) {
      const p = E.inOutExpo(prog(e, 0, .16));
      ctx.fillStyle = WORDS[i - 1].bg;
      ctx.beginPath(); ctx.moveTo(p * (W + 400), 0); ctx.lineTo(W + 400, 0); ctx.lineTo(W + 400, H); ctx.lineTo(p * (W + 400) - 400, H); ctx.fill();
    }
    hud(t, light);
  } else {
    bg(C.ink);
    const e = t - 3.5, z = Math.pow(70, E.inExpo(prog(t, 3.66, 4.0)));
    const r = rng(23), zl = prog(t, 3.6, 4.0);
    ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${.35 * zl})`; ctx.lineWidth = 2;
    for (let k = 0; k < 90; k++) {
      const a = r() * Math.PI * 2, d0 = 200 + r() * 900, len = 40 + zl * zl * (300 + r() * 700);
      const d = d0 + E.inExpo(zl) * 900;
      ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * d, CY + Math.sin(a) * d); ctx.lineTo(CX + Math.cos(a) * (d + len), CY + Math.sin(a) * (d + len)); ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.translate(CX + 70, CY); ctx.scale(z, z); ctx.translate(-70, 0);
    ctx.font = F(900, 250); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const chars = 'INSIGHT'.split(''); const ws = chars.map(ch => ctx.measureText(ch).width);
    const total = ws.reduce((a, b) => a + b, 0) + 10 * (chars.length - 1);
    let x = -total / 2;
    ctx.save(); ctx.beginPath(); ctx.rect(-W, -150, W * 2, 300); ctx.clip();
    chars.forEach((ch, k) => {
      const p = E.outExpo(clamp((e - k * .025) / .22));
      ctx.lineWidth = 3 / Math.sqrt(z); ctx.strokeStyle = '#fff';
      ctx.fillStyle = `rgba(210,31,35,${.95 * (1 - prog(t, 3.7, 3.9))})`;
      ctx.fillText(ch, x + ws[k] / 2, (1 - p) * -260);
      ctx.strokeText(ch, x + ws[k] / 2, (1 - p) * -260);
      x += ws[k] + 10;
    });
    ctx.restore(); ctx.restore();
    hud(t, false, 1 - prog(t, 3.7, 3.9));
  }
}

/* ═════════ C · glass shapes title (4.0 – 8.5) — Qcaly-style glossy opener ═════════ */
const TONES = {
  blue: { hi: '#d6e6ff', mid: '#3d86ff', deep: '#0c3cb4', rim: '#86b8ff' },
  peri: { hi: '#f3f4ff', mid: '#9fb0ff', deep: '#4b5bd0', rim: '#d0d7ff' },
  red: { hi: '#ffb8bb', mid: '#e0242b', deep: '#6e0a0f', rim: '#ff8085' }
};
function glassTorus(x, y, R, r, sq, rot, tone, hole = 0) {
  const T = TONES[tone];
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, sq);
  if (hole > 0) { ctx.fillStyle = `rgba(5,6,10,${hole})`; ctx.beginPath(); ctx.arc(0, 0, Math.max(0, R - r * .9), 0, 7); ctx.fill(); }
  const g = ctx.createLinearGradient(-R, -R, R, R);
  g.addColorStop(0, T.hi); g.addColorStop(.35, T.mid); g.addColorStop(.75, T.deep); g.addColorStop(1, T.rim);
  ctx.lineWidth = r * 2; ctx.strokeStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke();
  ctx.lineWidth = r * .55; ctx.strokeStyle = 'rgba(4,16,70,.22)'; ctx.beginPath(); ctx.arc(0, 0, R - r * .62, 0, 7); ctx.stroke();
  ctx.lineCap = 'round';
  ctx.lineWidth = r * .26; ctx.strokeStyle = 'rgba(255,255,255,.78)'; ctx.beginPath(); ctx.arc(0, 0, R + r * .4, 3.55, 5.15); ctx.stroke();
  ctx.lineWidth = r * .12; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(0, 0, R - r * .45, .35, 1.45); ctx.stroke();
  ctx.restore();
}
function glassCapsule(x, y, len, th, rot, tone) {
  const T = TONES[tone];
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const g = ctx.createLinearGradient(0, -th / 2, 0, th / 2);
  g.addColorStop(0, T.hi); g.addColorStop(.35, T.mid); g.addColorStop(.78, T.deep); g.addColorStop(1, T.rim);
  ctx.fillStyle = g; rrect(ctx, -len / 2, -th / 2, len, th, th / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.72)'; ctx.lineWidth = th * .09; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-len / 2 + th * .5, -th * .27); ctx.lineTo(len / 2 - th * .5, -th * .27); ctx.stroke();
  ctx.restore();
}
function glassBall(c, x, y, r, tone, alpha = 1) {
  const T = TONES[tone];
  c.save(); c.globalAlpha *= alpha;
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .05, x, y, r);
  g.addColorStop(0, T.hi); g.addColorStop(.5, T.mid); g.addColorStop(1, T.deep);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = r * .08; c.beginPath(); c.arc(x, y, r * .86, .2, 1.5); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(x - r * .38, y - r * .45, r * .2, r * .11, -.6, 0, 7); c.fill();
  c.restore();
}
function glassTri(x, y, s, rot, tone) {
  const T = TONES[tone];
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const pts = [[0, -s], [s * .9, s * .6], [-s * .9, s * .6]];
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = pts[i], b = pts[(i + 1) % 3], m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if (i === 0) ctx.moveTo(m[0], m[1]);
    ctx.arcTo(b[0], b[1], (b[0] + pts[(i + 2) % 3][0]) / 2, (b[1] + pts[(i + 2) % 3][1]) / 2, s * .18);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(-s, -s, s, s);
  g.addColorStop(0, T.hi); g.addColorStop(.45, T.mid); g.addColorStop(1, T.deep);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = s * .05; ctx.stroke();
  ctx.restore();
}
const SHAPES = (() => {
  const r = rng(314), kinds = ['torus', 'capsule', 'ball', 'tri', 'capsule', 'ball', 'torus', 'globe'], out = [];
  for (let i = 0; i < 30; i++) {
    let x = (r() - .5) * 3400, y = (r() - .5) * 2000;
    if (Math.abs(x) < 820 && Math.abs(y) < 420) x = Math.sign(x || 1) * (820 + r() * 500);
    const kind = kinds[i % kinds.length];
    out.push({ kind, x, y, z: 500 + r() * 3600, size: 110 + r() * 150, rot: r() * 6, spin: (r() - .5) * .9,
      tone: kind === 'globe' ? 'red' : r() < .12 ? 'red' : r() < .45 ? 'peri' : 'blue', sq: .35 + r() * .5, ph: r() * 6 });
  }
  out.push({ kind: 'torus', hero: true, x: 0, y: 30, z: 3000, size: 560, rot: -.15, spin: .08, tone: 'blue', sq: .8, ph: 0 });
  return out;
})();
function glassScene(u) {
  const g = ctx.createRadialGradient(CX + Math.sin(u * .7) * 260, CY - 120, 60, CX, CY, 1300);
  g.addColorStop(0, '#7ea6ff'); g.addColorStop(.42, '#2a62e8'); g.addColorStop(1, '#081a52');
  ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
  const camZ = u * 380 + E.inExpo(prog(u, 3.3, 4.5)) * 2350;
  const list = SHAPES.map(s => ({ s, d: s.z - camZ })).filter(o => o.d > 40).sort((a, b) => b.d - a.d);
  for (const { s, d } of list) {
    const k = 900 / d, x = CX + s.x * k, y = CY + s.y * k + Math.sin(u * 1.2 + s.ph) * 14 * k;
    const fade = clamp((4600 - d) / 1200) * (s.hero ? 1 : clamp((d - 40) / 260));
    if (fade <= 0) continue;
    const rot = s.rot + u * s.spin, sz = s.size * k;
    if (x < -sz * 2 || x > W + sz * 2 || y < -sz * 2 || y > H + sz * 2) continue;
    ctx.save(); ctx.globalAlpha = fade;
    if (s.kind === 'torus') glassTorus(x, y, sz, sz * .2, s.sq, rot * .3, s.tone, s.hero ? prog(u, 3.45, 3.9) : 0);
    else if (s.kind === 'capsule') glassCapsule(x, y, sz * 1.5, sz * .5, rot, s.tone);
    else if (s.kind === 'ball') glassBall(ctx, x, y, sz * .5, s.tone);
    else if (s.kind === 'tri') glassTri(x, y, sz * .55, rot, s.tone);
    else sphere(ctx, x, y, sz * .5, 1, 1, rot);
    ctx.restore();
  }
  // title copy
  const a1 = 1 - prog(u, 2.05, 2.3), a2 = 1 - prog(u, 3.25, 3.45);
  ctx.save(); ctx.fillStyle = '#fff';
  if (a1 > 0) {
    ctx.globalAlpha = a1;

/* ───────── master ───────── */
const HITS = [[.6, 22], [4.0, 10], [8.5, 8], [11.0, 8], [25.5, 12], [32.0, 16]];
function shake(t) {

  HITS.forEach(([h, a]) => { const e = t - h; if (e > 0 && e < .35) { const k = a * Math.exp(-e * 14); dx += Math.sin(e * 90) * k; dy += Math.cos(e * 77) * k; } });
  return [dx, dy];

const WHIPS = [[19.5, .38, 300], [25.5, .3, 240], [27.5, .35, 300]];
function whip(t) { let a = 0; WHIPS.forEach(([c, h, pk]) => { const d = Math.abs(t - c) / h; if (d < 1) a += pk * Math.pow(1 - d, 2); }); return a; }

  tctx.clearRect(0, 0, W, H); tctx.drawImage(work, 0, 0);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const n = 12;
  for (let k = 0; k < n; k++) { ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(tmp, (k / (n - 1) - .5) * amount, 0); }
  ctx.restore();
}
function render(t) {

  const [sx, sy] = shake(t); ctx.translate(sx, sy);

  else if (t < 4.0) s2(t);
  else if (t < 8.5) glassScene(t - 4.0);
  else if (t < 11.0) s3(t - 8.5 + 4.0);
  else if (t < 15.0) boardScene(t - 11.0);
  else if (t < 19.5) wallScene(t - 15.0);
  else if (t < 25.5) phoneScene(t - 19.5);
  else if (t < 27.5) s5(t - 25.5 + 9.0);
  else if (t < 32.0) collageScene(t - 27.5);

function composite(t, samples = 1, fps = 60) {
  out.globalAlpha = 1;

    render(t + (samples > 1 ? (s / samples) * (0.5 / fps) : 0));

  }
  out.globalAlpha = 1;

  const ox = (FRAME * 73) % 256, oy = (FRAME * 151) % 256;
  out.translate(-ox, -oy); out.fillStyle = out.createPattern(grain, 'repeat'); out.fillRect(0, 0, W + 256, H + 256); out.restore();
  const v = out.createRadialGradient(CX, CY, H * .45, CX, CY, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.28)');

}
window.DUR = DUR;
window.renderFrame = (i, fps = 60, samples = 4) => { FRAME = i; composite(i / fps, samples, fps); };
window.ready = document.fonts.load(F(800, 40)).then(() => document.fonts.load(F(600, 20))).then(() => document.fonts.load(F(900, 40))).then(() => true);
// live playback when opened directly (?t=SECONDS to start elsewhere)
if (!/[?&]render/.test(location.search)) window.ready.then(() => {
