<!-- @dsCard group="Colors" viewport="700x150" name="Brand blues" subtitle="One identity-blue family carries brand + every primary action" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--color-canvas); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-md); }
  .chip { height: 60px; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.06); }
  .name { font-size: var(--text-micro); font-weight: 700; color: var(--color-foreground); margin-top: 8px; }
  .hex { font-size: 11px; color: var(--color-muted); font-family: var(--font-mono); }
</style></head>
<body>
<div class="grid">
  <div><div class="chip" style="background:var(--blue-main)"></div><div class="name">Coinone Blue</div><div class="hex">#006BD6</div></div>
  <div><div class="chip" style="background:var(--blue-cta)"></div><div class="name">Primary CTA</div><div class="hex">#0B59D5</div></div>
  <div><div class="chip" style="background:var(--blue-outline)"></div><div class="name">Accent</div><div class="hex">#1772F8</div></div>
  <div><div class="chip" style="background:var(--blue-point)"></div><div class="name">Point</div><div class="hex">#0090FF</div></div>
  <div><div class="chip" style="background:var(--blue-sub-1)"></div><div class="name">Sub / hover</div><div class="hex">#194386</div></div>
  <div><div class="chip" style="background:var(--blue-navy)"></div><div class="name">Navy</div><div class="hex">#062554</div></div>
</div>
</body></html>
