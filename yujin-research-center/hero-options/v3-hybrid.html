<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 C · 라이트 브로드캐스트 — 유진 Insight Lab</title>
<link rel="preload" href="../assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="../assets/app.css" />
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-display:swap;src:url("../assets/fonts/PretendardVariable.woff2") format("woff2-variations")}
.hx{--up:#e0344b;--down:#143f96;--up-d:#ff7d8b;--down-d:#93b2ff;--ease:cubic-bezier(.16,1,.3,1);word-break:keep-all}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hx{position:relative;overflow:hidden;isolation:isolate;min-height:760px;padding-bottom:132px}
.hx .hero__bg{animation-duration:40s}
.hx__in{position:relative;z-index:2;max-width:1400px;margin:0 auto;padding:56px 40px 0;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:24px;align-items:center}

/* ── copy (원안 유지) ── */
.hx__status{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 14px 0 12px;border-radius:999px;background:rgba(255,255,255,.78);
  border:1px solid rgba(20,44,98,.08);backdrop-filter:blur(8px);font-size:13px;font-weight:700;color:var(--ink-800)}
.hx__status i{width:8px;height:8px;border-radius:50%;background:var(--gray-400)}
.hx__status[data-k=open] i{background:var(--up);animation:hxPulse 2s var(--ease) infinite}
.hx__status[data-k=pre] i{background:#e8a317}
.hx__status span+span{color:var(--ink-500);font-weight:600}
@keyframes hxPulse{0%{box-shadow:0 0 0 0 rgba(224,52,75,.45)}100%{box-shadow:0 0 0 8px rgba(224,52,75,0)}}
.hx h1{font-size:clamp(36px,4.1vw,56px);line-height:1.2;letter-spacing:-.025em;font-weight:800;color:var(--ink-900);margin:22px 0 0}
.hx h1 .b{color:var(--blue-cta)}
.hx__sub{margin-top:20px;font-size:18px;line-height:1.65;color:#4e5968;font-weight:500;max-width:28em}
.hx__cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.hx__cta .btn svg{width:18px;height:18px}
.hx__brief{margin-top:30px;display:flex;align-items:center;gap:14px;font-size:14px;color:#4e5968;font-weight:600}
.hx__brief b{color:var(--ink-900)}
.hx__brief .ln{width:28px;height:1px;background:#c5cfdd}

/* ── stage: anchor + real data cards ── */
.stage{position:relative;height:600px}
.anc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:290px;height:500px;border-radius:26px;padding:6px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 70px -24px rgba(20,44,98,.45)}
.anc__v{position:relative;width:100%;height:100%;border-radius:21px;overflow:hidden;background:#dfe6f1}
.anc__v video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;transform:scale(1.16);transform-origin:50% 100%}
.anc__top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.anc__bug{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 9px;border-radius:8px;background:var(--blue-navy);color:#fff;font-size:12px;font-weight:800}
.anc__bug i{width:6px;height:6px;border-radius:50%;background:#ff5a5f;animation:hxOn 1.6s ease-in-out infinite}
@keyframes hxOn{50%{opacity:.3}}
.anc__mute{width:36px;height:36px;border-radius:50%;border:0;background:rgba(11,46,107,.55);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .16s var(--ease)}
.anc__mute:active{transform:scale(.93)}
.anc__mute svg{width:17px;height:17px}
.anc__l3{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;background:rgba(11,22,48,.72);backdrop-filter:blur(10px);border-radius:14px;padding:11px 13px 12px}
.anc__tag{font-size:11px;font-weight:800;color:#9fc1ff;margin-bottom:5px;display:flex;justify-content:space-between}
.anc__cap{font-size:15px;line-height:1.5;font-weight:700;color:#fff;min-height:45px}
.anc__cap.in{animation:capIn .45s var(--ease) both}
@keyframes capIn{from{opacity:0;transform:translateY(8px);filter:blur(3px)}}
.anc__bar{height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:9px;overflow:hidden}
.anc__bar i{display:block;height:100%;width:0;background:#5aa2ff}
.anc__tabs{position:absolute;left:50%;bottom:-54px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);padding:4px;border-radius:12px;box-shadow:0 10px 24px -14px rgba(20,44,98,.35)}
.anc__tabs button{border:0;background:none;height:32px;padding:0 13px;border-radius:9px;font:700 13px inherit;font-family:inherit;color:#4e5968;cursor:pointer;white-space:nowrap}
.anc__tabs button[aria-pressed=true]{background:var(--blue-navy);color:#fff}

.dc{position:absolute;z-index:3;display:flex;flex-direction:column;gap:4px;width:206px;padding:13px 15px 14px;border-radius:16px;text-decoration:none;
  background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 16px 36px -16px rgba(20,44,98,.32);transition:transform .25s var(--ease),box-shadow .25s,background .25s;animation:floaty 7s ease-in-out infinite}
.dc:hover{background:rgba(255,255,255,.88);box-shadow:0 22px 44px -16px rgba(20,44,98,.42);animation-play-state:paused}
.dc__k{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:#4e5968}
.dc__k svg{width:14px;height:14px;color:#5374bf}
.dc__v{font-size:22px;font-weight:800;color:var(--ink-900);letter-spacing:-.02em;line-height:1.2}
.dc__v.up{color:var(--up)} .dc__v.down{color:var(--down)}
.dc__s{font-size:13px;color:#4e5968;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc--1{left:-1%;top:14%}
.dc--2{left:-3%;top:60%;animation-delay:-2.4s}
.dc--3{right:-3%;top:8%;animation-delay:-1.2s}
.dc--4{right:-1%;top:56%;animation-delay:-3.6s}

/* ── index strip (원안 유지, 실데이터·대비 보정) ── */
.hx .hero__indices{bottom:30px}
.hx .hero__indices .ix .n{color:#b4c2d9}
.hx .hero__indices .ix .c.up{color:var(--up-d)}
.hx .hero__indices .ix .c.down{color:var(--down-d)}
.hx__asof{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;z-index:3;font-size:12px;color:#4e5968;font-weight:600}

.peek{border-top:1px solid #e4e8ee;background:#fff;padding:32px 40px;text-align:center;font-size:14px;color:#5b6573}
:focus-visible{outline:2px solid var(--blue-cta);outline-offset:3px}

@media (max-width:1180px){
  .dc{width:186px}
  .dc--1,.dc--2{left:-2%}
  .dc--3,.dc--4{right:-2%}
}
@media (max-width:980px){
  .hx{padding-bottom:0}
  .hx__in{grid-template-columns:1fr;padding:32px 20px 0;gap:8px}
  .hx .hero__bg::after{background:linear-gradient(180deg,#fff 0,rgba(255,255,255,.88) 40%,rgba(255,255,255,.55) 100%)}
  .stage{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:28px 0 8px}
  .anc{position:relative;left:auto;top:auto;transform:none;grid-column:1/-1;margin:0 auto 64px;width:min(100%,320px);height:auto;aspect-ratio:9/15}
  .dc{position:static;width:auto;animation:none}
  .hx .hero__indices{position:relative;left:auto;bottom:auto;transform:none;width:auto;margin:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
  .hx .hero__indices .ix{min-width:0;padding:14px 8px;border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07)}
  .hx .hero__indices .ix .vr{flex-direction:column;align-items:center;gap:4px}
  .hx .hero__indices .ix .v{font-size:18px}
  .hx__asof{position:static;transform:none;text-align:center;padding:0 0 20px}
}
@media (max-width:560px){
  .hx h1{font-size:34px}
  .hx__sub{font-size:16px}
  .hx__cta .btn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){.dc,.anc__bug i,.anc__cap.in,.hx__status i{animation:none!important}}
</style>
</head>
<body>
<header class="nav">
  <div class="nav__brand">
    <img class="nav__logoimg" src="../assets/eugene-logo.png" alt="유진투자증권" />
    <span class="nav__divider"></span>
    <span class="nav__sub">Insight Lab</span>
  </div>
  <nav class="nav__links">
    <a href="../market.html">시황·테마</a><a href="../reports.html">리서치 리포트</a><a href="../events.html">종목 이벤트</a>
    <a href="../global.html">해외 AI 리서치</a><a href="../quant.html">퀀트 투자</a><a href="#">인사이트</a>
  </nav>
  <div class="nav__spacer"></div>
  <div class="nav__auth"><span style="display:inline-flex;align-items:center;gap:12px">
    <button class="btn btn--text" style="font-size:var(--text-body)">로그인</button>
    <button class="btn btn--primary btn--sm">회원가입</button></span></div>
</header>

<main>
<section class="hero hx" aria-labelledby="hxTitle">
  <div class="hero__bg"></div>
  <svg class="hero__net" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g class="net-flow">
      <path d="M430 110L560 80"/><path d="M560 80L660 150"/><path d="M430 110L520 185"/><path d="M520 185L620 250"/>
      <path d="M660 150L725 205"/><path d="M620 250L725 205"/><path d="M520 185L470 250"/><path d="M620 250L585 320"/>
      <path d="M725 205L705 300"/><path d="M585 320L705 300"/><path d="M560 80L520 185"/>
      <path d="M430 110L440 180"/><path d="M440 180L470 250"/><path d="M470 250L390 300"/><path d="M520 185L560 230"/>
      <path d="M560 230L620 250"/><path d="M560 230L585 320"/><path d="M620 250L640 360"/><path d="M680 260L620 250"/>
      <path d="M680 260L705 300"/><path d="M660 150L760 140"/><path d="M610 140L660 150"/>
    </g>
  </svg>

  <div class="hx__in">
    <div class="hx__copy">
      <div class="hx__status" id="hxStatus" data-k="closed"><i aria-hidden="true"></i><span id="hxSess">장 상태</span><span id="hxAsof">불러오는 중</span></div>
      <h1 id="hxTitle">유진투자증권<br/>리서치 플랫폼<br/><span class="b">유진 Insight Lab</span></h1>
      <p class="hx__sub">깊이 있는 인사이트와 데이터 기반 분석으로<br/>더 나은 투자와 미래를 설계합니다.</p>
      <div class="hx__cta">
        <a class="btn btn--navy" href="../reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg>리포트 둘러보기</a>
        <a class="btn btn--league" href="../trading/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M9 20h6M12 14v6"/></svg>Trading League <span class="arw" aria-hidden="true">↗</span></a>
      </div>
      <div class="hx__brief"><span class="ln" aria-hidden="true"></span><span>매일 아침 <b id="hxSecs">AI 앵커</b> 브리핑으로 시장을 먼저 읽으세요</span></div>
    </div>

    <div class="stage">
      <a class="dc dc--1" id="dc1" href="../market.html"></a>
      <a class="dc dc--2" id="dc2" href="../market.html"></a>
      <div class="anc">
        <div class="anc__v">
          <video id="v" autoplay muted playsinline loop crossorigin="anonymous" preload="auto"></video>
          <div class="anc__top">
            <span class="anc__bug"><i aria-hidden="true"></i><span id="bug">유진 AI 앵커</span></span>
            <button class="anc__mute" id="mute" type="button" aria-label="소리 켜기" aria-pressed="false">
              <svg id="icoMute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>
              <svg id="icoSnd" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
            </button>
          </div>
          <div class="anc__l3"><div class="anc__tag"><span id="tag">오늘의 시황</span><span class="tnum" id="clock">0:00</span></div>
            <div class="anc__cap" id="cap" aria-live="polite">&nbsp;</div><div class="anc__bar" aria-hidden="true"><i id="bar"></i></div></div>
        </div>
        <div class="anc__tabs" id="tabs" role="group" aria-label="브리핑 선택"></div>
      </div>
      <a class="dc dc--3" id="dc3" href="../reports.html"></a>
      <a class="dc dc--4" id="dc4" href="../events.html"></a>
    </div>
  </div>

  <div class="hero__indices" id="ix" role="list" aria-label="주요 지수"></div>
  <div class="hx__asof" id="ixAsof"></div>
</section>
<div class="peek">↓ 아래로 오늘의 시황 · 리서치 리포트 · 테마 섹션이 이어집니다 (시안 비교용 표시)</div>
</main>

<script src="hero-data.js"></script>
<script>
(async function(){
  const $=s=>document.querySelector(s), {num,dir,signed,pct,fmt,eok,mmdd,session,sentences,reduced}=HD;
  const s=session(); $('#hxStatus').dataset.k=s.key; $('#hxSess').textContent=s.label;
  const D=await loadHeroData(), m=D.market, B=D.briefings;
  $('#hxAsof').textContent=`${mmdd(m.date)} 마감 기준`+(D.live?'':' · 예시');

  /* real data cards — replace the decorative glass chips with the day's facts */
  const ic={
    chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>',
    bars:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
    bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>'
  };
  const card=(k,i,v,vc,sub)=>`<span class="dc__k">${k}${ic[i]}</span><span class="dc__v ${vc||''} tnum">${v}</span>${sub?`<span class="dc__s">${sub}</span>`:''}`;
  const f=(m.flows||{}).kospi||{};
  $('#dc1').innerHTML=card('오늘의 코스피','chart',signed(m.kospi_chg),dir(m.kospi_chg),f.foreign?`외국인 ${eok(f.foreign)} · 기관 ${eok(f.inst)}`:'');
  const st=(m.strong||[])[0];
  $('#dc2').innerHTML=st?card('강세 업종','bars',st.name,'',`<span class="up">${signed(st.chg)}</span> · 약세 ${(m.weak||[])[0]?m.weak[0].name:''}`):'';
  const r=(D.reports||[])[0];
  $('#dc3').innerHTML=card('새 리포트','doc',`${(D.reports||[]).length}건`,'',r?r.title:'오늘 발간 리포트를 정리하고 있어요');
  const e=(D.events||[])[0];
  $('#dc4').innerHTML=e?card('주요 공시','bell',e.name,'',e.tag||''):'';
  ['#dc2','#dc4'].forEach(id=>{ if(!$(id).innerHTML) $(id).remove(); });

  /* index strip — same component, real numbers (NASDAQ·S&P from global_indices) */
  const g=n=>(D.globals||[]).find(x=>x.name===n);
  const items=[['KOSPI',m.kospi,m.kospi_chg],['KOSDAQ',m.kosdaq,m.kosdaq_chg],
    g('NASDAQ')&&['NASDAQ',fmt(g('NASDAQ').price),pct(g('NASDAQ').change_pct)],
    g('S&P 500')&&['S&P 500',fmt(g('S&P 500').price),pct(g('S&P 500').change_pct)],
    ['USD/KRW',m.usdkrw,m.usdkrw_chg]].filter(Boolean);
  $('#ix').innerHTML=items.map(([n,v,c])=>`<div class="ix" role="listitem"><span class="n">${n}</span><span class="vr"><span class="v" data-v="${v}">${v}</span><span class="c ${dir(c)}">${signed(c)}</span></span></div>`).join('');
  $('#ixAsof').textContent=`${mmdd(m.date)} 종가 기준 · 해외지수는 현지 종가`;
  if(!reduced()) document.querySelectorAll('#ix .v').forEach(el=>{
    const raw=el.dataset.v.replace(/,/g,''), n=parseFloat(raw), dec=(raw.split('.')[1]||'').length; if(isNaN(n)) return;
    const t0=performance.now(); (function tick(t){const p=Math.min(1,(t-t0)/1100), k=1-Math.pow(2,-10*p);
      el.textContent=(n*(.9+.1*k)).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); if(p<1) requestAnimationFrame(tick); else el.textContent=el.dataset.v;})(t0);
  });

  /* AI anchor — muted autoplay, script-synced lower third, tap for sound */
  const v=$('#v'); let cur=0, lines=[], spans=[], lastK=-1;
  $('#tabs').innerHTML=B.map((b,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===0}">${b.kind==='market'?'시황':'리포트'} 브리핑 ${mmdd(b.brief_date)}</button>`).join('');
  function setMute(mu){ $('#mute').setAttribute('aria-pressed',!mu); $('#mute').setAttribute('aria-label',mu?'소리 켜기':'소리 끄기');
    $('#icoMute').style.display=mu?'':'none'; $('#icoSnd').style.display=mu?'none':''; }
  function load(i,snd){
    cur=i; const b=B[i]; if(!b) return; lines=sentences(b.script); lastK=-1;
    $('#tag').textContent=b.kind==='market'?'오늘의 시황':'오늘의 리포트';
    $('#bug').textContent=`유진 AI 앵커 · ${mmdd(b.brief_date)}`;
    document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.i===i));
    v.src=b.video_url; if(b.thumbnail_url) v.poster=b.thumbnail_url;
    v.muted=!snd; v.loop=!snd; setMute(v.muted); v.play().catch(()=>{});
  }
  v.addEventListener('loadedmetadata',()=>{
    const sec=Math.round(v.duration); $('#hxSecs').textContent=`${sec}초 AI 앵커`;
    const tot=lines.reduce((a,l)=>a+l.length,0)||1; let acc=0;
    spans=lines.map(l=>{const a=acc/tot*v.duration; acc+=l.length; return [a,acc/tot*v.duration];});
  });
  v.addEventListener('timeupdate',()=>{
    $('#bar').style.width=(v.currentTime/v.duration*100)+'%';
    $('#clock').textContent=`0:${String(Math.floor(v.currentTime)).padStart(2,'0')}`;
    const k=spans.findIndex(([a,b])=>v.currentTime>=a&&v.currentTime<b);
    if(k>=0&&k!==lastK){ lastK=k; const c=$('#cap'); c.textContent=lines[k]; c.classList.remove('in'); void c.offsetWidth; c.classList.add('in'); }
  });
  v.addEventListener('ended',()=>{ if(!v.loop&&B.length>1) load((cur+1)%B.length,!v.muted); });
  $('#mute').addEventListener('click',()=>{ const on=v.muted; v.muted=!on; v.loop=!on; if(on) v.currentTime=0; setMute(v.muted); v.play(); });
  $('#tabs').addEventListener('click',ev=>{const b=ev.target.closest('button'); if(b) load(+b.dataset.i,!v.muted);});
  load(0,false);
})();
</script>
</body>
</html>
